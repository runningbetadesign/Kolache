<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kolache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f7f5;
  --surface: #ffffff;
  --border: #e5e1dc;
  --border-faint: #ede9e4;
  --text-1: #1c1917;
  --text-2: #57534e;
  --text-3: #a8a29e;
  --accent: #292524;
  --yes: #2d6a4f;
  --yes-light: #eef6f1;
  --yes-border: #c2dcd0;
  --no: #8b3e2c;
  --no-light: #fdf2ef;
  --no-border: #f0c9be;
  --dough: #5c4a1e;
  --warn: #854d0e;
  --warn-bg: #fef9c3;
  --dispute: #7a1f1f;
  --dispute-bg: #fde7e7;
  --pending: #1e4e8c;
  --pending-bg: #e6effb;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  height: 56px;
  padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: 'Lora', serif;
  font-size: 20px; font-weight: 600; letter-spacing: -.3px;
}
.player-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 10px 5px 5px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 500;
  color: var(--text-1);
  max-width: 230px; overflow: hidden;
}
.player-pill:active { background: #f5f4f2; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; letter-spacing: .3px;
}
.pill-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-dough { color: var(--dough); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-caret { opacity: .4; flex-shrink: 0; }

/* ── TAB BAR ── */
.tab-bar {
  position: sticky; top: 56px; z-index: 49;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; padding: 0 4px;
  overflow-x: auto; scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  padding: 13px 14px 11px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px; font-weight: 500;
  color: var(--text-3);
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab.active { color: var(--text-1); border-bottom-color: var(--text-1); }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--no); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 1;
  margin-left: 4px; vertical-align: middle;
}

/* ── VIEWS ── */
.view { display: none; padding: 16px; max-width: 580px; margin: 0 auto; padding-bottom: 100px; }
.view.active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05);
}
.wgr-category {
  font-size: 10px; font-weight: 600; letter-spacing: .9px;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
}
.wgr-question {
  font-family: 'Lora', serif;
  font-size: 17px; font-weight: 600; line-height: 1.35;
  color: var(--text-1); margin-bottom: 4px;
}
.wgr-subline {
  font-size: 12px; color: var(--text-3); margin-bottom: 10px;
  line-height: 1.5;
}
.pool-totals {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 10px;
  font-size: 15px; font-weight: 500;
}
.pool-total-num {
  font-family: 'Lora', serif;
  font-size: 20px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.pool-total-item.yes { color: var(--yes); }
.pool-total-item.no  { color: var(--no); }
.pool-total-sep { color: var(--border); font-size: 18px; }
.pool-total-pot { color: var(--text-3); font-size: 13px; }

/* ── WAGER LINE ── */
.wgr-line {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--text-2);
  padding: 6px 0;
}
.wgr-line strong { color: var(--text-1); font-weight: 600; }
.wgr-line + .wgr-line { border-top: 1px solid var(--border-faint); }
.side-chip {
  display: inline-block;
  padding: 2px 9px; border-radius: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
}
.side-chip.yes { background: var(--yes-light); color: var(--yes); }
.side-chip.no  { background: var(--no-light);  color: var(--no); }

/* ── TAKE BUTTON ── */
.btn-take {
  width: 100%; margin-top: 12px;
  padding: 11px 0;
  border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1.5px solid;
  transition: opacity .1s, transform .1s;
}
.btn-take:active { opacity: .8; transform: scale(.99); }
.btn-take.yes { background: var(--yes-light); color: var(--yes); border-color: var(--yes-border); }
.btn-take.no  { background: var(--no-light);  color: var(--no);  border-color: var(--no-border); }

/* ── META ── */
.wgr-meta {
  display: flex; flex-wrap: wrap; gap: 8px;
  font-size: 12px; color: var(--text-3); margin-top: 10px;
}
.badge-overdue {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  background: var(--warn-bg); color: var(--warn);
  font-size: 10px; font-weight: 600; letter-spacing: .3px;
}
.badge-pending {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  background: var(--pending-bg); color: var(--pending);
  font-size: 10px; font-weight: 600; letter-spacing: .3px;
}
.badge-disputed {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  background: var(--dispute-bg); color: var(--dispute);
  font-size: 10px; font-weight: 600; letter-spacing: .3px;
}

/* ── MY BETS STRIP ── */
.my-bets {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-faint);
  display: flex; flex-direction: column; gap: 4px;
}
.my-bet-line {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--text-2);
}
.bet-pos-amt { color: var(--yes); font-weight: 600; }
.bet-neg-amt { color: var(--no);  font-weight: 600; }

/* ── ACTION STRIP (resolve / cancel / propose / re-propose) ── */
.action-strip {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-faint);
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap;
}
.action-label { font-size: 12px; color: var(--text-3); flex: 1; min-width: 120px; }
.btn-action {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface);
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer;
}
.btn-action:active { opacity: .8; }
.btn-confirm {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--yes-border); background: var(--yes-light);
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--yes); cursor: pointer;
}
.btn-dispute {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--no-border); background: var(--no-light);
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--no); cursor: pointer;
}
.btn-confirm:active, .btn-dispute:active { opacity: .8; }
.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: 24px; right: 16px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); color: #fff;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  z-index: 48; transition: transform .15s;
}
.fab:active { transform: scale(.94); }

/* ── SHEET ── */
.backdrop {
  position: fixed; inset: 0; background: transparent;
  z-index: 100; pointer-events: none; transition: background .25s;
}
.backdrop.open { background: rgba(0,0,0,.35); pointer-events: all; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  z-index: 101;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  max-height: 92vh; overflow-y: auto;
  overscroll-behavior: contain;
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 12px auto;
}
.sheet-body { padding: 4px 20px 44px; }
.sheet-title {
  font-family: 'Lora', serif;
  font-size: 20px; font-weight: 600;
  color: var(--text-1); margin-bottom: 18px;
}
.sheet-sub {
  font-family: 'Lora', serif;
  font-size: 15px; color: var(--text-2);
  line-height: 1.5; margin-bottom: 16px;
}

/* Forms */
.field { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 12px; font-weight: 600; letter-spacing: .3px;
  color: var(--text-2); margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 15px; color: var(--text-1);
  background: var(--bg); outline: none;
  transition: border-color .15s;
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
.helper { font-size: 12px; color: var(--text-3); margin-top: 5px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two-col .field-label { margin-bottom: 6px; }

.side-toggle { display: flex; gap: 8px; }
.side-btn {
  flex: 1; padding: 11px 0;
  border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text-3);
  transition: border-color .12s, color .12s, background .12s;
}
.side-btn.on.yes { background: var(--yes-light); color: var(--yes); border-color: var(--yes-border); }
.side-btn.on.no  { background: var(--no-light);  color: var(--no);  border-color: var(--no-border); }

.btn-primary {
  width: 100%; padding: 14px;
  border-radius: 8px; border: none;
  font-family: 'Outfit', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer; color: #fff; background: var(--accent);
  transition: opacity .15s;
}
.btn-primary:active { opacity: .8; }

/* Player list */
.pli {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 7px;
  cursor: pointer; font-family: 'Outfit', sans-serif; text-align: left;
}
.pli:active { background: #f5f4f2; }
.pli.current { border-color: var(--accent); background: #f8f7f5; }
.pli-name { flex: 1; font-size: 15px; font-weight: 500; }
.pli-bal  { font-size: 13px; font-weight: 600; color: var(--dough); }

/* Info box */
.info-box {
  background: var(--bg); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 16px;
}
.info-row {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--text-2); padding: 2px 0;
}
.info-row strong { color: var(--text-1); }

/* Resolve btns */
.resolve-btns { display: flex; gap: 10px; margin-top: 4px; }
.btn-ryes, .btn-rno {
  flex: 1; padding: 14px; border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer;
}
.btn-ryes { background: var(--yes-light); color: var(--yes); border: 1.5px solid var(--yes-border); }
.btn-rno  { background: var(--no-light);  color: var(--no);  border: 1.5px solid var(--no-border); }
.btn-ryes:active, .btn-rno:active { opacity: .8; }

/* ── STANDINGS ── */
.standing {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05);
}
.standing.me { border-color: var(--accent); background: #faf9f7; }
.rank { font-family: 'Lora', serif; font-size: 17px; font-weight: 600; color: var(--text-3); width: 28px; flex-shrink: 0; }
.rank.gold   { color: #b8860b; }
.rank.silver { color: #8a8a8a; }
.rank.bronze { color: #a0622e; }
.s-info { flex: 1; min-width: 0; }
.s-name   { font-size: 15px; font-weight: 500; }
.s-record { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.s-bal    { font-family: 'Lora', serif; font-size: 16px; font-weight: 600; color: var(--dough); white-space: nowrap; }

/* ── RESOLVED ── */
.res-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
}
.badge-yes { background: var(--yes-light); color: var(--yes); }
.badge-no  { background: var(--no-light);  color: var(--no); }

/* ── EMPTY ── */
.empty { text-align: center; padding: 56px 20px; color: var(--text-3); }
.empty-title { font-family: 'Lora', serif; font-size: 17px; color: var(--text-2); margin-bottom: 6px; }
.empty-desc  { font-size: 14px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 84px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--accent); color: #fff;
  padding: 9px 18px; border-radius: 20px;
  font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 2000; white-space: nowrap;
  max-width: calc(100vw - 40px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

hr { border: none; border-top: 1px solid var(--border-faint); margin: 14px 0; }

/* ── POOL / VOTE / RESOLVE ── */
.pool-summary { display: flex; gap: 10px; margin: 10px 0; }
.pool-side { flex: 1; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; }
.pool-side.yes { background: var(--yes-light); color: var(--yes); border: 1px solid var(--yes-border); }
.pool-side.no  { background: var(--no-light);  color: var(--no);  border: 1px solid var(--no-border); }
.type-chip { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-left: 6px; }
.type-chip.pool { background: #e8e0f0; color: #5b3a8c; }
.type-chip.wager { background: var(--bg); color: var(--text-3); }
.vote-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.btn-vote { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-vote.yes { border-color: var(--yes-border); color: var(--yes); }
.btn-vote.no  { border-color: var(--no-border);  color: var(--no); }
.btn-vote.voted { font-weight: 700; }
.btn-vote.yes.voted { background: var(--yes-light); }
.btn-vote.no.voted  { background: var(--no-light); }
.resolve-row { display: flex; gap: 10px; margin: 10px 0; }
.filter-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.filter-btn {
  padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: 'Outfit', sans-serif;
  font-size: 12px; font-weight: 500;
  color: var(--text-3); cursor: pointer;
}
.filter-btn.on {
  border-color: var(--accent); color: var(--accent);
  background: var(--bg); font-weight: 600;
}
.participants-sides {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-faint);
  display: flex; flex-direction: column; gap: 6px;
}
.side-group {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
.side-label {
  font-size: 10px; font-weight: 700; letter-spacing: .5px;
  padding: 1px 6px; border-radius: 4px;
  flex-shrink: 0;
}
.side-label.yes { background: var(--yes-light); color: var(--yes); }
.side-label.no  { background: var(--no-light);  color: var(--no); }
.participant {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--text-2);
}
.participant-amt {
  font-size: 11px; color: var(--text-3); font-weight: 500;
}
.avatar-sm {
  width: 18px; height: 18px; border-radius: 50%;
  color: #fff; font-size: 7px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* Join banner */
.join-banner {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 14px; margin-bottom: 12px;
  font-size: 13px; color: var(--text-2);
}
.btn-join {
  padding: 5px 13px; border-radius: 20px;
  border: 1px solid var(--accent);
  background: var(--accent); color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 12px; font-weight: 600; cursor: pointer;
  white-space: nowrap;
}

/* ── AUTH SCREEN ─────────────────────────────────────────────────────────── */
.auth-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.auth-screen.show { display: flex; }
.auth-inner { max-width: 360px; width: 100%; text-align: center; }
.auth-logo {
  font-family: 'Lora', serif;
  font-size: 36px; font-weight: 600; letter-spacing: -.5px;
  margin-bottom: 8px;
}
.auth-tag {
  font-size: 13px; color: var(--text-3);
  margin-bottom: 36px; letter-spacing: .3px;
}
.auth-msg {
  font-size: 15px; color: var(--text-2);
  margin-bottom: 18px; line-height: 1.55;
}
.auth-msg.subtle { font-size: 13px; color: var(--text-3); margin-top: 24px; }
.btn-google {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 22px; border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text-1);
  font-family: 'Outfit', sans-serif;
  font-size: 15px; font-weight: 500; cursor: pointer;
  transition: background .12s;
}
.btn-google:active { background: var(--bg); }
.btn-google svg { width: 18px; height: 18px; }
.btn-link {
  background: none; border: none;
  color: var(--text-3); cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: 13px; padding: 8px 12px;
}
.btn-link:hover { color: var(--text-2); }
.auth-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--text-1);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.auth-form {
  display: flex; flex-direction: column; gap: 10px;
  margin-bottom: 16px;
}
.auth-form input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 15px; color: var(--text-1);
  background: var(--surface); outline: none;
  -webkit-appearance: none; appearance: none;
}
.auth-form input:focus { border-color: var(--accent); }
.auth-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--text-3); font-size: 11px;
  letter-spacing: .15em; text-transform: uppercase;
  margin: 28px 0 16px;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.btn-primary-auth {
  display: block; width: 100%;
  padding: 13px 20px; border-radius: 10px;
  border: none; background: var(--accent); color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn-primary-auth:active { opacity: .85; }
.btn-google.full {
  display: flex; width: 100%;
  justify-content: center;
}
.auth-section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .18em;
  text-transform: uppercase; color: var(--text-3);
  margin-bottom: 12px;
}
.auth-error {
  background: var(--no-light);
  color: var(--no);
  border: 1px solid var(--no-border);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 12px;
  text-align: left;
  word-break: break-word;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">Kolache</div>
  <button class="player-pill" id="pill" onclick="openPlayerList()">
    <span id="pillInner">Select Player</span>
    <svg class="pill-caret" width="10" height="6" viewBox="0 0 10 6" fill="none">
      <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<nav class="tab-bar">
  <button class="tab active" onclick="switchTab(this,'bets')">Bets</button>
  <button class="tab" onclick="switchTab(this,'standings')">Standings</button>
  <button class="tab" onclick="switchTab(this,'resolved')">Resolved</button>
  <button class="tab" id="adminTab" style="display:none" onclick="switchTab(this,'admin')">Admin</button>
</nav>

<div class="view active" id="v-bets"></div>
<div class="view" id="v-standings"></div>
<div class="view" id="v-resolved"></div>
<div class="view" id="v-admin"></div>

<!-- Auth gate: covers everything until the user signs in and is allowlisted. -->
<div class="auth-screen" id="authScreen">
  <div class="auth-inner">
    <div class="auth-logo">Kolache</div>
    <div class="auth-tag">FRIENDS-ONLY WAGERING</div>
    <div id="authBody"></div>
  </div>
</div>

<button class="fab" id="fab" onclick="openCreateWager()">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
    <path d="M9 2v14M2 9h14" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</button>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── STATE ─────────────────────────────────────────────────────────────────
// Players and wagers are objects keyed by their RTDB key. Players are keyed
// by their Firebase Auth uid; wagers by push id. Each value carries an `id`
// field synthesized from the key. confirmedBy / disputedBy on a wager are
// objects keyed by playerId (uid) with `true` as the value.
const ADMIN_EMAIL = 'patrick.hermiller@gmail.com';
const S = {
  players: {},
  wagers:  {},
  allowlist: {},        // {emailKey: true} — synced from /kolache_v3/allowlist
  pending:   {},        // {emailKey: {name, email, requestedAt}} — admin sees these
  authUser:  null,      // firebase.User or null
  authStatus: 'init',   // 'init' | 'signedout' | 'pending' | 'allowed'
};
const DOUGH_START = 1000;
const CATS = ['Sports','Entertainment','Pop Culture','Finance','Science','Tech','Other'];

// ── UTILS ─────────────────────────────────────────────────────────────────
// RTDB keys can't contain `.`, so emails are stored with dots → commas.
const emailKey   = e => String(e || '').toLowerCase().replace(/\./g, ',');
const myUid      = () => S.authUser?.uid || null;
const myEmailKey = () => S.authUser ? emailKey(S.authUser.email) : null;
const isAdmin    = () => !!(S.authUser && S.authUser.email && S.authUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
const me         = () => myUid() && S.players[myUid()] ? S.players[myUid()] : null;
const esc  = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt  = n  => `${Math.round(n).toLocaleString()} dough`;
const initials = name => name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0,2);
const fmtDate  = d => { const dt = new Date(d); return isNaN(dt) ? '—' : dt.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); };
const overdue  = w => new Date(w.closeDate) < new Date();
const acceptanceList = w => w && w.acceptances ? Object.values(w.acceptances) : [];

// ── WAGER HELPERS ─────────────────────────────────────────────────────────
function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a); }
function impliedOdds(risk, win) {
  if (!risk || !win) return '—';
  if (risk === win) return 'Even';
  const g = gcd(risk, win) || 1;
  return `${risk/g}:${win/g}`;
}
function poolTaken(w)     { return acceptanceList(w).reduce((s, a) => s + a.takerStake, 0); }
function poolRemaining(w) { return Math.max(0, w.takerPool - poolTaken(w)); }
function isFilled(w)      { return poolRemaining(w) === 0; }
function proposerExposureFor(w, takerStake) {
  // Proposer's matched escrow for one acceptance, prorated against takerPool.
  return Math.round(takerStake * w.proposerStake / w.takerPool);
}
function parties(w) {
  const ids = new Set();
  if (w.proposerId != null) ids.add(w.proposerId);
  if ((w.type || 'wager') === 'pool') {
    for (const b of poolBetList(w)) ids.add(b.playerId);
  } else {
    for (const a of acceptanceList(w)) ids.add(a.takerId);
  }
  return [...ids];
}
function isParty(w, playerId) {
  if (playerId == null) return false;
  if (w.proposerId === playerId) return true;
  if ((w.type || 'wager') === 'pool') {
    return poolBetList(w).some(b => b.playerId === playerId);
  }
  return acceptanceList(w).some(a => a.takerId === playerId);
}

// ── POOL HELPERS ─────────────────────────────────────────────────────────
function poolBetList(w)         { return w && w.poolBets ? Object.values(w.poolBets) : []; }
function poolTotal(w)           { return poolBetList(w).reduce((s, b) => s + b.amount, 0); }
function poolSideTotal(w, side) { return poolBetList(w).filter(b => b.side === side).reduce((s, b) => s + b.amount, 0); }

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAll() {
  // Gate on auth — show the auth screen instead of the app until allowed.
  if (S.authStatus !== 'allowed') {
    renderAuthScreen();
    return;
  }
  document.getElementById('authScreen').classList.remove('show');
  renderPill();
  renderBets();
  renderStandings();
  renderResolved();
  renderAdmin();
  if (!S._tabRestored) { S._tabRestored = true; restoreTab(); }
}

const GOOGLE_ICON = `<svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.79 2.72v2.26h2.9c1.7-1.56 2.69-3.87 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.46-.8 5.95-2.18l-2.9-2.26c-.81.54-1.83.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7a5.41 5.41 0 0 1 0-3.4V4.96H.96a9 9 0 0 0 0 8.08l2.99-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>`;

function renderAuthScreen() {
  const screen = document.getElementById('authScreen');
  const body   = document.getElementById('authBody');
  screen.classList.add('show');
  if (S.authStatus === 'init') {
    body.innerHTML = `<div class="auth-spinner"></div>`;
    return;
  }
  if (S.authStatus === 'signedout') {
    // Request-to-join is the primary CTA. Sign-in is the secondary path
    // for already-approved users.
    //
    // iOS autofill quirks: read values via FormData (more reliable than
    // input.value right after autofill commits) and wire handlers with
    // addEventListener rather than inline onsubmit-via-innerHTML, which
    // iOS Safari sometimes ignores. We also attach the same handler to
    // the button's click event as a backup in case the form's submit
    // event doesn't fire for some reason.
    body.innerHTML = `
      <p class="auth-msg">Kolache is invite-only. Request access below and the admin will let you in.</p>
      <div class="auth-section-label">New here? Request access</div>
      <form id="reqForm" novalidate>
        <div class="auth-form">
          <input type="text"  id="reqName"  name="name"  placeholder="Your name" maxlength="40" autocomplete="name" autocapitalize="words">
          <input type="email" id="reqEmail" name="email" placeholder="Your Google email" autocomplete="email" inputmode="email">
        </div>
        <button type="submit" id="reqSubmit" class="btn-primary-auth">Request access</button>
        <div id="reqError" class="auth-error" style="display:none"></div>
      </form>
      <div class="auth-divider">or</div>
      <div class="auth-section-label">Already approved?</div>
      <button class="btn-google full" onclick="signIn()">${GOOGLE_ICON} Sign in with Google</button>
    `;
    const form = document.getElementById('reqForm');
    const go = (e) => { e.preventDefault(); submitRequest(form); return false; };
    form.addEventListener('submit', go);
    document.getElementById('reqSubmit').addEventListener('click', go);
    return;
  }
  if (S.authStatus === 'requested') {
    body.innerHTML = `
      <p class="auth-msg">Got it — your request was sent.</p>
      <p class="auth-msg">Once the admin approves you, come back here and sign in with Google using the same email.</p>
      <button class="btn-google full" onclick="signIn()">${GOOGLE_ICON} Sign in with Google</button>
      <button class="btn-link" onclick="backToRequest()" style="margin-top:6px">Use a different email</button>
    `;
    return;
  }
  if (S.authStatus === 'pending') {
    // Signed in via Google but not on the allowlist yet.
    const name = S.authUser?.displayName || S.authUser?.email || 'friend';
    body.innerHTML = `
      <p class="auth-msg">Hi, <strong>${esc(name)}</strong>.</p>
      <p class="auth-msg">Your access request was logged. You'll be let in once the admin approves you — this page will switch over automatically.</p>
      <button class="btn-link" onclick="signOut()">Sign out</button>
    `;
  }
}

// Guard against double-submit while a write is in flight.
let _submitInFlight = false;

function showReqError(msg) {
  const el = document.getElementById('reqError');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}
function clearReqError() {
  const el = document.getElementById('reqError');
  if (el) { el.style.display = 'none'; el.textContent = ''; }
}

// formEl is the <form> element (passed by the listener). FormData reads from
// the form's own snapshot of inputs, which is more reliable than .value
// immediately after iOS autofill commits.
function submitRequest(formEl) {
  if (_submitInFlight) return;
  formEl = formEl || document.getElementById('reqForm');
  clearReqError();

  // iOS autofill quirk: blur the active input so the autofill UI doesn't
  // capture the next tap. Reading FormData also forces Safari to "commit"
  // pending autofill values into the inputs' .value.
  try { document.activeElement?.blur(); } catch(e) {}

  const nameInput  = document.getElementById('reqName');
  const emailInput = document.getElementById('reqEmail');
  const fd = formEl ? new FormData(formEl) : null;

  // Belt-and-suspenders: prefer FormData, fall back to .value.
  let name  = (fd?.get('name')  || nameInput?.value  || '').toString().trim();
  let email = (fd?.get('email') || emailInput?.value || '').toString().trim().toLowerCase();

  if (!name)                          { showReqError('Please enter your name');         return; }
  if (!email || !email.includes('@')) { showReqError('Please enter a valid email');     return; }
  if (!_db)                           { showReqError('Not connected — refresh the page'); return; }

  // Immediate visible feedback so the user knows the tap registered, even
  // before the network round-trip completes. We don't transition state
  // until the write actually lands — that way a rules denial or network
  // failure surfaces a real error instead of a confusing flicker.
  const submitBtn = document.getElementById('reqSubmit');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    submitBtn.style.opacity = '0.7';
  }
  _submitInFlight = true;
  toast('Sending request…');

  const ek = emailKey(email);
  _db.ref(`${DB_PATH}/pending/${ek}`).set({
    name, email, requestedAt: TS()
  }).then(() => {
    _submitInFlight = false;
    try { localStorage.setItem('kolache_requested', email); } catch(e) {}
    S.authStatus = 'requested';
    renderAll();
    toast('Request sent!');
  }).catch(e => {
    _submitInFlight = false;
    console.error('submitRequest:', e);
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request access';
      submitBtn.style.opacity = '';
    }
    // Show the actual error inline. Toast also fires (z-index now correct)
    // but inline message stays visible until the user retries.
    const errCode = e?.code || e?.message || 'unknown';
    showReqError('Couldn\'t send request — ' + errCode);
    toast('Failed: ' + errCode);
  });
}

function backToRequest() {
  try { localStorage.removeItem('kolache_requested'); } catch(e) {}
  S.authStatus = 'signedout';
  renderAll();
}

function renderPill() {
  const p = me();
  document.getElementById('pillInner').innerHTML = p
    ? `<span class="avatar" style="background:${avatarColor(p.id)}">${initials(p.name)}</span>
       <span class="pill-name">${esc(p.name)}</span>
       <span class="pill-dough">${fmt(p.balance)}</span>`
    : `<span style="padding:0 4px;color:var(--text-2)">+ Join</span>`;
}

function joinBanner() {
  // Only reached briefly post-sign-in while we create the player record.
  return `<div class="join-banner">
    <span>Setting up your account…</span>
  </div>`;
}

function emptyState(title, desc) {
  return `<div class="empty"><div class="empty-title">${esc(title)}</div><p class="empty-desc">${esc(desc)}</p></div>`;
}

let _betFilter = 'all';
function setBetFilter(f) { _betFilter = f; renderBets(); }

function renderBets() {
  const el = document.getElementById('v-bets');
  const player = me();
  const all = Object.values(S.wagers)
    .filter(w => w.status !== 'resolved')
    .sort((a, b) => (b.createdAt||0) - (a.createdAt||0));

  let filtered = all;
  if (_betFilter === 'mine' && player) {
    filtered = all.filter(w => isParty(w, player.id));
  } else if (_betFilter === 'open') {
    filtered = all.filter(w => !overdue(w));
  } else if (_betFilter === 'closing') {
    filtered = all.filter(w => overdue(w));
  }

  const banner = player ? '' : joinBanner();
  const filterBar = `<div class="filter-bar">
    <button class="filter-btn ${_betFilter === 'all' ? 'on' : ''}" onclick="setBetFilter('all')">All</button>
    <button class="filter-btn ${_betFilter === 'mine' ? 'on' : ''}" onclick="setBetFilter('mine')">My Bets</button>
    <button class="filter-btn ${_betFilter === 'open' ? 'on' : ''}" onclick="setBetFilter('open')">Open</button>
    <button class="filter-btn ${_betFilter === 'closing' ? 'on' : ''}" onclick="setBetFilter('closing')">Needs Resolution</button>
  </div>`;

  if (!filtered.length) {
    el.innerHTML = banner + filterBar + emptyState('No bets match', 'Try a different filter or tap + to post one');
    return;
  }
  el.innerHTML = banner + filterBar + filtered.map(wagerCard).join('');
}

function renderParticipants(w) {
  const wtype = w.type || 'wager';
  const yesSide = {};
  const noSide = {};

  if (wtype === 'pool') {
    for (const b of poolBetList(w)) {
      const bucket = b.side === 'YES' ? yesSide : noSide;
      bucket[b.playerId] = (bucket[b.playerId] || 0) + b.amount;
    }
  } else {
    if (w.proposerId) {
      const bucket = w.proposerSide === 'YES' ? yesSide : noSide;
      bucket[w.proposerId] = w.proposerStake || 0;
    }
    for (const a of acceptanceList(w)) {
      const otherSide = w.proposerSide === 'YES' ? noSide : yesSide;
      otherSide[a.takerId] = (otherSide[a.takerId] || 0) + a.takerStake;
    }
  }

  const renderSide = (map, side) => {
    const entries = Object.entries(map);
    if (!entries.length) return '';
    return entries.map(([id, amt]) => {
      const p = S.players[id];
      if (!p) return '';
      return `<span class="participant ${side.toLowerCase()}"><span class="avatar-sm" style="background:${avatarColor(id)}">${initials(p.name)}</span>${esc(p.name)} <span class="participant-amt">${fmt(amt)}</span></span>`;
    }).join('');
  };

  const yesHTML = renderSide(yesSide, 'YES');
  const noHTML  = renderSide(noSide, 'NO');
  if (!yesHTML && !noHTML) return '';

  return `<div class="participants-sides">
    ${yesHTML ? `<div class="side-group yes"><span class="side-label yes">YES</span>${yesHTML}</div>` : ''}
    ${noHTML  ? `<div class="side-group no"><span class="side-label no">NO</span>${noHTML}</div>` : ''}
  </div>`;
}

function wagerCard(w) {
  const wtype = w.type || 'wager';
  return wtype === 'pool' ? wagerCardPool(w) : wagerCardStandard(w);
}

function renderVoteArea(w, player) {
  const past = overdue(w);
  if (!past || w.status !== 'open') return '';
  const isMine = player && player.id === w.proposerId;
  const proposer = S.players[w.proposerId];
  const votes = w.votes || {};
  const yesVotes = Object.values(votes).filter(v => v === 'YES').length;
  const noVotes  = Object.values(votes).filter(v => v === 'NO').length;
  const myVote = player ? (votes[player.id] || null) : null;
  let tally = '';
  if (yesVotes || noVotes) {
    tally = `<div style="font-size:12px;color:var(--text-3);margin:4px 0">Votes: ${yesVotes} YES, ${noVotes} NO</div>`;
  }
  if (isMine) {
    return `<div class="action-strip">
      <span class="action-label">Past close date — resolve</span>
      <div class="resolve-row">
        <button class="btn-ryes" onclick="resolve('${w.id}','YES')">Resolve YES</button>
        <button class="btn-rno"  onclick="resolve('${w.id}','NO')">Resolve NO</button>
      </div>
    </div>${tally}`;
  }
  if (player) {
    const yVoted = myVote === 'YES' ? ' voted' : '';
    const nVoted = myVote === 'NO'  ? ' voted' : '';
    return `<div class="action-strip">
      <span class="action-label">Waiting for ${esc(proposer?.name || 'creator')} to resolve</span>
      <div class="vote-row">
        <button class="btn-vote yes${yVoted}" onclick="castVote('${w.id}','YES')">YES</button>
        <button class="btn-vote no${nVoted}"  onclick="castVote('${w.id}','NO')">NO</button>
      </div>
    </div>${tally}`;
  }
  return tally;
}

function wagerCardStandard(w) {
  const player    = me();
  const proposer  = S.players[w.proposerId];
  const isMine    = player && player.id === w.proposerId;
  const remaining = poolRemaining(w);
  const past      = overdue(w);

  const otherSide  = w.proposerSide === 'YES' ? 'NO' : 'YES';
  const proposerCl = w.proposerSide === 'YES' ? 'yes' : 'no';
  const otherCl    = otherSide === 'YES' ? 'yes' : 'no';

  const myTakes   = player ? acceptanceList(w).filter(a => a.takerId === player.id) : [];
  const myStaked  = myTakes.reduce((s, a) => s + a.takerStake, 0);
  const hasAcceptances = acceptanceList(w).length > 0;

  const canTake = player && !isMine && remaining > 0 && !past && w.status === 'open';

  // ── meta line
  const meta = [
    `${fmt(poolTaken(w))} / ${fmt(w.takerPool)} matched`,
    `Closes ${fmtDate(w.closeDate)}`,
    past && w.status === 'open' ? `<span class="badge-overdue">Needs resolution</span>` : '',
  ].filter(Boolean).join(' · ');

  // ── action area
  let action = '';
  if (canTake) {
    action = `<button class="btn-take ${otherCl}" onclick="openAccept('${w.id}')">
      Take ${otherSide} &nbsp;·&nbsp; ${fmt(remaining)} left
    </button>`;
  } else if (isMine && !hasAcceptances && w.status === 'open' && !past) {
    action = `<div class="action-strip">
      <span class="action-label">No takers yet — your dough is held</span>
      <button class="btn-action" onclick="cancelWager('${w.id}')">Cancel</button>
    </div>`;
  } else if (past && w.status === 'open') {
    action = renderVoteArea(w, player);
  }

  // ── my position strip
  let mine = '';
  if (myStaked) {
    mine = `<div class="my-bets">
      <div class="my-bet-line">
        <span>You took ${otherSide}</span>
        <span class="bet-${otherCl === 'yes' ? 'pos' : 'neg'}-amt">${fmt(myStaked)}</span>
      </div>
    </div>`;
  } else if (isMine) {
    mine = `<div class="my-bets">
      <div class="my-bet-line">
        <span>Your side</span>
        <span class="side-chip ${proposerCl}">${w.proposerSide}</span>
      </div>
    </div>`;
  }

  const editBtn = isAdmin() && w.status === 'open' ? `<button class="btn-link" style="font-size:12px;padding:0" onclick="openEditWager('${w.id}')">Edit</button>` : '';
  const matched = poolTaken(w);
  const sub = [`${impliedOdds(w.proposerStake, w.takerPool)} odds`,
    `${fmt(matched)} / ${fmt(w.takerPool)} matched`,
    fmtDate(w.closeDate)].join(' · ');

  return `<div class="card">
    <div class="wgr-category" style="display:flex;justify-content:space-between;align-items:center">
      <span>${esc(w.category)} <span class="type-chip wager">1-on-1</span></span>
      ${editBtn}
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-subline">${sub}${past && w.status === 'open' ? ' · <span class="badge-overdue">Needs resolution</span>' : ''}</div>
    ${renderParticipants(w)}
    ${action}
  </div>`;
}

function wagerCardPool(w) {
  const player   = me();
  const proposer = S.players[w.proposerId];
  const isMine   = player && player.id === w.proposerId;
  const past     = overdue(w);

  const yesTotal = poolSideTotal(w, 'YES');
  const noTotal  = poolSideTotal(w, 'NO');
  const total    = poolTotal(w);

  const myBets = player ? poolBetList(w).filter(b => b.playerId === player.id) : [];
  const canBet = player && !past && w.status === 'open';

  // meta
  const meta = [
    `Pot: ${fmt(total)}`,
    `Closes ${fmtDate(w.closeDate)}`,
    past && w.status === 'open' ? `<span class="badge-overdue">Needs resolution</span>` : '',
  ].filter(Boolean).join(' · ');

  // action
  let action = '';
  if (canBet) {
    action = `<div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-take yes" style="flex:1" onclick="openPlacePoolBet('${w.id}')">Bet YES</button>
      <button class="btn-take no"  style="flex:1" onclick="openPlacePoolBet('${w.id}')">Bet NO</button>
    </div>`;
  } else if (past && w.status === 'open') {
    action = renderVoteArea(w, player);
  }

  // my pool bets
  let mine = '';
  if (myBets.length) {
    mine = `<div class="my-bets">${myBets.map(b => {
      const cl = b.side === 'YES' ? 'pos' : 'neg';
      return `<div class="my-bet-line"><span>You bet ${b.side}</span><span class="bet-${cl}-amt">${fmt(b.amount)}</span></div>`;
    }).join('')}</div>`;
  }

  const editBtn = isAdmin() && w.status === 'open' ? `<button class="btn-link" style="font-size:12px;padding:0" onclick="openEditWager('${w.id}')">Edit</button>` : '';
  const sub = [fmtDate(w.closeDate)].join(' · ');

  return `<div class="card">
    <div class="wgr-category" style="display:flex;justify-content:space-between;align-items:center">
      <span>${esc(w.category)} <span class="type-chip pool">Pool</span></span>
      ${editBtn}
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-subline">${sub}${past && w.status === 'open' ? ' · <span class="badge-overdue">Needs resolution</span>' : ''}</div>
    <div class="pool-totals">
      <span class="pool-total-item yes"><span class="pool-total-num">${fmt(yesTotal)}</span> YES</span>
      <span class="pool-total-sep">·</span>
      <span class="pool-total-item no"><span class="pool-total-num">${fmt(noTotal)}</span> NO</span>
      <span class="pool-total-sep">·</span>
      <span class="pool-total-pot">${fmt(total)} pot</span>
    </div>
    ${renderParticipants(w)}
    ${action}
  </div>`;
}

function renderResolved() {

  el.innerHTML = list.map(w => {

    return renderResolvedWager(w, player);

function renderResolvedWager(w, player) {
  const proposer = S.players[w.proposerId];
  const proposerWon = w.proposerSide === w.resolution;
  const myParty = player && isParty(w, player.id);
  const accs = acceptanceList(w);
  let myLine = '';
  if (myParty) {
    let net = 0;
    if (player.id === w.proposerId) {
      for (const a of accs) {
        const exp = proposerExposureFor(w, a.takerStake);
        net += proposerWon ? a.takerStake : -exp;
      }
    } else {
      const mine = accs.filter(a => a.takerId === player.id);
      for (const a of mine) {
        const exp = proposerExposureFor(w, a.takerStake);
        net += proposerWon ? -a.takerStake : exp;
      }
    }
    const cls  = net >= 0 ? 'bet-pos-amt' : 'bet-neg-amt';
    const sign = net >= 0 ? '+' : '−';
    myLine = `<div class="my-bets"><div class="my-bet-line">
      <span>Your result</span>
      <span class="${cls}">${sign}${fmt(Math.abs(net))}</span>
    </div></div>`;
  }
  return `<div class="card">
    <div class="res-header">
      <div class="wgr-category" style="margin:0">${esc(w.category)}<span class="type-chip wager">1-on-1</span></div>
      <span class="badge badge-${w.resolution.toLowerCase()}">${w.resolution}</span>
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-meta">
      <span>${esc(proposer?.name || '?')} ${proposerWon ? 'won' : 'lost'} ${w.proposerSide}</span>
      <span>Resolved ${fmtDate(w.resolvedAt)}</span>
      <span>${accs.length} taker${accs.length !== 1 ? 's' : ''}</span>
    </div>
    ${myLine}
  </div>`;
}

function renderResolvedPool(w, player) {
  const proposer = S.players[w.proposerId];
  const total = poolTotal(w);
  const myParty = player && isParty(w, player.id);
  let myLine = '';
  if (myParty) {
    const myBets = poolBetList(w).filter(b => b.playerId === player.id);
    const myStaked = myBets.reduce((s, b) => s + b.amount, 0);
    const winTotal = poolSideTotal(w, w.resolution);
    const loseTotal = total - winTotal;
    let net = 0;
    for (const b of myBets) {
      if (b.side === w.resolution) {
        if (loseTotal === 0) {
          // refund scenario — net 0
        } else {
          net += Math.floor(b.amount / winTotal * total) - b.amount;
        }
      } else {
        net -= b.amount;
      }
    }
    const cls  = net >= 0 ? 'bet-pos-amt' : 'bet-neg-amt';
    const sign = net >= 0 ? '+' : '−';
    myLine = `<div class="my-bets"><div class="my-bet-line">
      <span>Your result</span>
      <span class="${cls}">${sign}${fmt(Math.abs(net))}</span>
    </div></div>`;
  }
  return `<div class="card">
    <div class="res-header">
      <div class="wgr-category" style="margin:0">${esc(w.category)}<span class="type-chip pool">Pool</span></div>
      <span class="badge badge-${w.resolution.toLowerCase()}">${w.resolution}</span>
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-meta">
      <span>Pot: ${fmt(total)}</span>
      <span>Resolved ${fmtDate(w.resolvedAt)}</span>
    </div>
    ${myLine}
  </div>`;
}

function switchTab(btn, view) {

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');

  const btn = document.querySelector(`.tab[onclick*="'${tab}'"]`);

function avatarColor(id) {
  // Stable hash-based color for any string id (push keys are not integers).
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return ['#292524','#3d5a80','#2d6a4f','#7b2d8b','#8b4513','#1d4e89'][Math.abs(h) % 6];
}

  document.getElementById('sideYes').classList.toggle('on', s === 'YES');
  document.getElementById('sideNo').classList.toggle('on', s === 'NO');
}

function updateOddsHint() {
  const risk = Math.floor(+document.getElementById('wRisk').value);
  const win  = Math.floor(+document.getElementById('wWin').value);
  const el = document.getElementById('oddsHint');
  if (!risk || !win) { el.textContent = 'Set both amounts.'; return; }
  let label = '';
  if (risk === win)       label = 'Even money';
  else if (risk > win)    label = `${impliedOdds(risk, win)} — you're laying the favorite`;
  else                    label = `${impliedOdds(risk, win)} — you're taking the underdog`;
  el.innerHTML = `${label} · anyone can take up to <strong>${fmt(win)}</strong>.`;
}

function createWager() {
  const q    = (document.getElementById('wQ').value || '').trim();
  const cat  = document.getElementById('wC').value;
  const date = document.getElementById('wD').value;
  const player = me(); if (!player) return;

  if (!q)    return toast('Write a question');
  if (!date) return toast('Pick a close date');
  if (!_db)  return toast('Not connected — try again');

  const newId = _db.ref(`${DB_PATH}/wagers`).push().key;
  const updates = {};

  if (_pickedType === 'pool') {
    updates[`${DB_PATH}/wagers/${newId}`] = {
      type: 'pool',
      question: q, category: cat, closeDate: date,
      proposerId: player.id,
      proposerSide: null,
      proposerStake: 0,
      takerPool: 0,
      status: 'open',
      resolution: null, resolvedAt: null,
      createdAt: TS()
    };
  } else {
    const risk = Math.floor(+document.getElementById('wRisk').value);
    const win  = Math.floor(+document.getElementById('wWin').value);
    if (!risk || risk<1)  return toast('Enter what you risk');
    if (!win  || win<1)   return toast('Enter what you can win');
    if (risk > (player.balance||0)) return toast(`Not enough dough — you have ${fmt(player.balance||0)}`);
    updates[`${DB_PATH}/wagers/${newId}`] = {
      type: 'wager',
      question: q, category: cat, closeDate: date,
      proposerId: player.id,
      proposerSide: _pickedSide,
      proposerStake: risk,
      takerPool: win,
      status: 'open',
      resolution: null, resolvedAt: null,
      createdAt: TS()
    };
    updates[`${DB_PATH}/players/${player.id}/balance`] = (player.balance||0) - risk;
  }

  _db.ref().update(updates).then(() => {
    closeSheet();
    toast('Bet posted!');
  }).catch(e => { console.error('createWager:', e); toast('Failed to post — try again'); });
}

// ── ACCEPT WAGER ──────────────────────────────────────────────────────────
function openAccept(wagerId) {
  if (!me()) { toast('Setting up your account…'); return; }
  const w = S.wagers[wagerId]; if (!w) return;
  const player = me();
  if (w.proposerId === player.id) return toast("Can't take your own bet");
  const remaining = poolRemaining(w);
  if (remaining <= 0) return toast('Fully matched');
  const proposer  = S.players[w.proposerId];
  const otherSide = w.proposerSide === 'YES' ? 'NO' : 'YES';
  const otherCl   = otherSide === 'YES' ? 'yes' : 'no';
  const cap = Math.min(remaining, player.balance||0);
  const presets = [25, 50, 100, 250].filter(v => v <= cap);

  openSheet(`<div class="sheet-title">Take this bet</div>
    <div class="sheet-sub">${esc(w.question)}</div>
    <div class="info-box">
      <div class="info-row"><span>${esc(proposer?.name || '?')}'s side</span><strong>${w.proposerSide}</strong></div>
      <div class="info-row"><span>Your side</span><strong style="color:var(--${otherCl})">${otherSide}</strong></div>
      <div class="info-row"><span>Odds</span><strong>${impliedOdds(w.proposerStake, w.takerPool)}</strong></div>
      <div class="info-row"><span>Available to take</span><strong>${fmt(remaining)}</strong></div>
    </div>
    <div class="field">
      <label class="field-label">Your stake &nbsp;<span style="font-weight:400;color:var(--text-3)">Balance: ${fmt(player.balance||0)}</span></label>
      ${presets.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${
        presets.map(v => `<button type="button" class="btn-action" onclick="setAcceptAmt(${v},'${wagerId}')">${v}</button>`).join('')
      }${cap > 0 ? `<button type="button" class="btn-action" onclick="setAcceptAmt(${cap},'${wagerId}')">Max ${cap}</button>` : ''}</div>` : ''}
      <input type="number" id="acceptAmt" min="1" max="${cap}" step="1" placeholder="Up to ${cap}" inputmode="numeric" oninput="calcAcceptPayout('${wagerId}')">
      <p class="helper" id="acceptPayout">Enter an amount to see your payout.</p>
    </div>
    <button class="btn-primary" style="background:var(--${otherCl})" onclick="acceptWager('${wagerId}')">Take ${otherSide}</button>`);
  setTimeout(() => document.getElementById('acceptAmt')?.focus(), 300);
}

function setAcceptAmt(v, wagerId) {
  const el = document.getElementById('acceptAmt');
  if (!el) return;
  el.value = v;
  calcAcceptPayout(wagerId);
}

function calcAcceptPayout(wagerId) {
  const w  = S.wagers[wagerId]; if (!w) return;
  const el = document.getElementById('acceptPayout'); if (!el) return;
  const amt = Math.floor(+document.getElementById('acceptAmt').value);
  if (!amt || amt < 1) { el.textContent = 'Enter an amount to see your payout.'; return; }
  const propExposure = proposerExposureFor(w, amt);
  el.innerHTML = `If you win: <strong style="color:var(--yes)">+${fmt(propExposure)}</strong> profit (return ${fmt(amt + propExposure)}).`;
}

function acceptWager(wagerId) {
  const w = S.wagers[wagerId]; if (!w) return;
  const player = me(); if (!player) return;
  const amt = Math.floor(+document.getElementById('acceptAmt').value);
  const remaining = poolRemaining(w);
  if (!amt || amt < 1)            return toast('Enter a valid amount');
  if (amt > remaining)            return toast(`Only ${fmt(remaining)} left`);
  if (amt > (player.balance||0))  return toast('Not enough dough');
  if (w.proposerId === player.id) return toast("Can't take your own bet");
  if (w.status !== 'open')        return toast('Bet is no longer open');
  if (!_db) return toast('Not connected — try again');

  // Atomic: push acceptance to its own key + debit taker's balance.
  // Each acceptance has a unique push key, so two takers accepting concurrently
  // cannot collide (the bug we're fixing). Balance is computed from local state
  // which is fine here — collisions are vanishingly rare since two debits would
  // need to land on the SAME player from two devices within the same tick.
  const accId = _db.ref(`${DB_PATH}/wagers/${wagerId}/acceptances`).push().key;
  const updates = {};
  updates[`${DB_PATH}/wagers/${wagerId}/acceptances/${accId}`] = {
    takerId: player.id, takerStake: amt, acceptedAt: TS()
  };
  updates[`${DB_PATH}/players/${player.id}/balance`] = (player.balance||0) - amt;
  _db.ref().update(updates).then(() => {
    closeSheet();
    const otherSide = w.proposerSide === 'YES' ? 'NO' : 'YES';
    toast(`Took ${fmt(amt)} on ${otherSide}`);
  }).catch(e => { console.error('acceptWager:', e); toast('Take failed — try again'); });
}

// ── CANCEL (proposer only, no acceptances) ────────────────────────────────
function cancelWager(wagerId) {
  const w = S.wagers[wagerId]; if (!w) return;
  const player = me(); if (!player || player.id !== w.proposerId) return;
  if (acceptanceList(w).length) return toast('Already has takers — can\'t cancel');
  if (!_db) return toast('Not connected — try again');

  // Atomic: delete the wager (set to null) + refund proposer's escrow.
  const updates = {};
  updates[`${DB_PATH}/wagers/${wagerId}`] = null;
  updates[`${DB_PATH}/players/${player.id}/balance`] = (player.balance||0) + w.proposerStake;
  _db.ref().update(updates).then(() => {
    toast('Bet cancelled — dough refunded');
  }).catch(e => { console.error('cancelWager:', e); toast('Cancel failed — try again'); });
}

// ── RESOLVE / VOTE / SETTLE ───────────────────────────────────────────────
function resolve(wagerId, outcome) {
  const w = S.wagers[wagerId]; if (!w) return;
  if (w.proposerId !== myUid()) return toast('Only the creator can resolve');
  if (w.status !== 'open') return toast('Bet is not open');
  if (!_db) return toast('Not connected');
  // Transaction flips status open → resolved exactly once across all clients.
  _db.ref(`${DB_PATH}/wagers/${wagerId}/status`).transaction(cur => {
    if (cur !== 'open') return; // abort
    return 'resolved';
  }, (err, committed) => {
    if (err) { console.error('resolve status:', err); toast('Resolve failed'); return; }
    if (!committed) { toast('Already resolved'); return; }
    const wtype = w.type || 'wager';
    if (wtype === 'pool') {
      settlePool(w, outcome);
    } else {
      settleApplyPayouts(w, outcome);
    }
    toast(`Resolved ${outcome}`);
  });
}

function castVote(wagerId, vote) {
  if (!myUid()) return toast('Sign in first');
  const w = S.wagers[wagerId]; if (!w) return;
  if (!_db) return toast('Not connected');
  const currentVote = w.votes && w.votes[myUid()] ? w.votes[myUid()] : null;
  const newVal = currentVote === vote ? null : vote;
  _db.ref(`${DB_PATH}/wagers/${wagerId}/votes/${myUid()}`).set(newVal)
    .then(() => toast(newVal ? `Voted ${newVal}` : 'Vote retracted'))
    .catch(e => { console.error('castVote:', e); toast('Vote failed'); });
}

function settleApplyPayouts(w, outcome) {
  const proposerId = w.proposerId;
  const proposerWon = w.proposerSide === outcome;
  const accs = acceptanceList(w);
  const taken = poolTaken(w);

  // Accumulate per-player deltas, then apply as absolute values.
  const balanceDelta = {};
  const winDelta = {};
  const lossDelta = {};
  const bump = (map, pid, n) => { map[pid] = (map[pid] || 0) + n; };

  // Refund proposer's unmatched portion (if takerPool wasn't fully filled).
  if (taken < w.takerPool) {
    const matchedExposure = Math.round(taken * w.proposerStake / w.takerPool);
    const unmatched = w.proposerStake - matchedExposure;
    if (unmatched > 0) bump(balanceDelta, proposerId, unmatched);
  }

  // Settle each acceptance independently against the proposer.
  for (const a of accs) {
    const propExp = proposerExposureFor(w, a.takerStake);
    if (proposerWon) {
      bump(balanceDelta, proposerId, propExp + a.takerStake);
      bump(winDelta,   proposerId, 1);
      bump(lossDelta,  a.takerId,  1);
    } else {
      bump(balanceDelta, a.takerId, a.takerStake + propExp);
      bump(winDelta,   a.takerId,  1);
      bump(lossDelta,  proposerId, 1);
    }
  }

  const updates = {};
  updates[`${DB_PATH}/wagers/${w.id}/resolution`] = outcome;
  updates[`${DB_PATH}/wagers/${w.id}/resolvedAt`] = TS();
  updates[`${DB_PATH}/wagers/${w.id}/resolvedBy`] = myUid();

  for (const [pid, delta] of Object.entries(balanceDelta)) {
    const p = S.players[pid]; if (!p) continue;
    updates[`${DB_PATH}/players/${pid}/balance`] = (p.balance||0) + delta;
  }
  for (const [pid, delta] of Object.entries(winDelta)) {
    const p = S.players[pid]; if (!p) continue;
    updates[`${DB_PATH}/players/${pid}/wins`] = (p.wins||0) + delta;
  }
  for (const [pid, delta] of Object.entries(lossDelta)) {
    const p = S.players[pid]; if (!p) continue;
    updates[`${DB_PATH}/players/${pid}/losses`] = (p.losses||0) + delta;
  }

  _db.ref().update(updates).catch(e => console.error('settle apply:', e));
}

function settlePool(w, outcome) {
  const bets = poolBetList(w);
  const totalPot = bets.reduce((s, b) => s + b.amount, 0);
  const winTotal = bets.filter(b => b.side === outcome).reduce((s, b) => s + b.amount, 0);
  const loseTotal = totalPot - winTotal;

  const balanceDelta = {};
  const winDelta = {};
  const lossDelta = {};
  const bump = (map, pid, n) => { map[pid] = (map[pid] || 0) + n; };

  if (winTotal === 0) {
    // All bets on losing side — no payouts
  } else if (loseTotal === 0) {
    // Everyone bet on winning side — refund everyone
    for (const b of bets) {
      bump(balanceDelta, b.playerId, b.amount);
    }
  } else {
    // Normal: winners split total pot proportionally
    for (const b of bets) {
      if (b.side === outcome) {
        const payout = Math.floor(b.amount / winTotal * totalPot);
        bump(balanceDelta, b.playerId, payout);
        bump(winDelta, b.playerId, 1);
      } else {
        bump(lossDelta, b.playerId, 1);
      }
    }
  }

  // Collect unique playerIds on each side for wins/losses
  const updates = {};
  updates[`${DB_PATH}/wagers/${w.id}/resolution`] = outcome;
  updates[`${DB_PATH}/wagers/${w.id}/resolvedAt`] = TS();
  updates[`${DB_PATH}/wagers/${w.id}/resolvedBy`] = myUid();

  for (const [pid, delta] of Object.entries(balanceDelta)) {
    const p = S.players[pid]; if (!p) continue;
    updates[`${DB_PATH}/players/${pid}/balance`] = (p.balance||0) + delta;
  }
  for (const [pid, delta] of Object.entries(winDelta)) {
    const p = S.players[pid]; if (!p) continue;
    updates[`${DB_PATH}/players/${pid}/wins`] = (p.wins||0) + delta;
  }
  for (const [pid, delta] of Object.entries(lossDelta)) {
    const p = S.players[pid]; if (!p) continue;
    updates[`${DB_PATH}/players/${pid}/losses`] = (p.losses||0) + delta;
  }

  _db.ref().update(updates).catch(e => console.error('settlePool:', e));
}

// ── POOL BETTING ──────────────────────────────────────────────────────────
let _poolSide = 'YES';
function openPlacePoolBet(wagerId) {
  if (!me()) { toast('Setting up your account…'); return; }
  const w = S.wagers[wagerId]; if (!w) return;
  const player = me();
  if (w.status !== 'open') return toast('Bet is closed');
  if (overdue(w)) return toast('Past close date');
  _poolSide = 'YES';
  const yesTotal = poolSideTotal(w, 'YES');
  const noTotal  = poolSideTotal(w, 'NO');
  const cap = player.balance || 0;
  const presets = [25, 50, 100, 250].filter(v => v <= cap);

  openSheet(`<div class="sheet-title">Place a Pool Bet</div>
    <div class="sheet-sub">${esc(w.question)}</div>
    <div class="pool-summary">
      <div class="pool-side yes"><strong>${fmt(yesTotal)}</strong><br>YES pool</div>
      <div class="pool-side no"><strong>${fmt(noTotal)}</strong><br>NO pool</div>
    </div>
    <div class="field">
      <label class="field-label">Your side</label>
      <div class="side-toggle">
        <button type="button" class="side-btn yes on" id="poolSideYes" onclick="pickPoolSide('YES')">YES</button>
        <button type="button" class="side-btn no"     id="poolSideNo"  onclick="pickPoolSide('NO')">NO</button>
      </div>
    </div>
    <div class="field">
      <label class="field-label">Amount &nbsp;<span style="font-weight:400;color:var(--text-3)">Balance: ${fmt(cap)}</span></label>
      ${presets.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${
        presets.map(v => `<button type="button" class="btn-action" onclick="document.getElementById('poolAmt').value=${v}">${v}</button>`).join('')
      }${cap > 0 ? `<button type="button" class="btn-action" onclick="document.getElementById('poolAmt').value=${cap}">Max ${cap}</button>` : ''}</div>` : ''}
      <input type="number" id="poolAmt" min="1" max="${cap}" step="1" placeholder="Up to ${cap}" inputmode="numeric">
    </div>
    <button class="btn-primary" onclick="placePoolBet('${w.id}')">Place Bet</button>`);
  setTimeout(() => document.getElementById('poolAmt')?.focus(), 300);
}

function pickPoolSide(s) {
  _poolSide = s;
  document.getElementById('poolSideYes').classList.toggle('on', s === 'YES');
  document.getElementById('poolSideNo').classList.toggle('on', s === 'NO');
}

function placePoolBet(wagerId) {
  const w = S.wagers[wagerId]; if (!w) return;
  const player = me(); if (!player) return;
  const amt = Math.floor(+document.getElementById('poolAmt').value);
  if (!amt || amt < 1)           return toast('Enter a valid amount');
  if (amt > (player.balance||0)) return toast('Not enough dough');
  if (w.status !== 'open')       return toast('Bet is no longer open');
  if (overdue(w))                return toast('Past close date');
  if (!_db) return toast('Not connected');

  const betId = _db.ref(`${DB_PATH}/wagers/${wagerId}/poolBets`).push().key;
  const updates = {};
  updates[`${DB_PATH}/wagers/${wagerId}/poolBets/${betId}`] = {
    playerId: player.id, side: _poolSide, amount: amt, placedAt: TS()
  };
  updates[`${DB_PATH}/players/${player.id}/balance`] = (player.balance||0) - amt;
  _db.ref().update(updates).then(() => {
    closeSheet();
    toast(`Bet ${fmt(amt)} on ${_poolSide}`);
  }).catch(e => { console.error('placePoolBet:', e); toast('Bet failed — try again'); });
}

// ── SYNC ──────────────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC5YQ4t50HKTeCgKkXcVg0LJ8yULWce8QM",
  authDomain: "kolache-e58fa.firebaseapp.com",
  databaseURL: "https://kolache-e58fa-default-rtdb.firebaseio.com",
  projectId: "kolache-e58fa",
  storageBucket: "kolache-e58fa.firebasestorage.app",
  messagingSenderId: "96097618636",
  appId: "1:96097618636:web:968b2566f0e15845955069"
};

// Data lives under /kolache_v3 — incompatible with the old /kolache_v2 blob
// (we moved from a whole-tree set() to per-path updates, breaking schema).
const DB_PATH = 'kolache_v3';
let _db = null;
let _dataListenersAttached = false;
let _selfAllowlistListener = null; // ref currently being listened on, for cleanup

const TS = () => firebase.database.ServerValue.TIMESTAMP;

// Convert {id: data, ...} from RTDB into {id: {id, ...data}, ...} so the rest
// of the app can use a single object shape that carries the key on the value.
function applySnap(snap, into) {
  const raw = snap.val() || {};
  const next = {};
  for (const [id, data] of Object.entries(raw)) {
    if (data && typeof data === 'object') next[id] = { id, ...data };
  }
  if (into === 'players') S.players = next;
  else                    S.wagers  = next;
}

// ── AUTH ───────────────────────────────────────────────────────────────────
function signIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  firebase.auth().signInWithPopup(provider).catch(e => {
    console.error('signIn:', e);
    // Common failure: popup blocked. Try redirect as fallback.
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') return;
    toast('Sign-in failed');
  });
}

function signOut() {
  firebase.auth().signOut().catch(e => console.error('signOut:', e));
  closeSheet();
}

// User just signed in. Check the allowlist (admin always counts). Allowed →
// attach data listeners + ensure player record. Not allowed → write a pending
// request and listen for approval.
function handleSignedIn(user) {
  const ek = emailKey(user.email);
  const isAdminUser = user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  _db.ref(`${DB_PATH}/allowlist/${ek}`).once('value').then(snap => {
    if (snap.val() === true || isAdminUser) {
      try { localStorage.removeItem('kolache_requested'); } catch(e) {}
      S.authStatus = 'allowed';
      ensurePlayerRecord(user);
      attachDataListeners();
      renderAll();
    } else {
      S.authStatus = 'pending';
      writePendingRequest(user);
      attachSelfAllowlistListener();
      renderAll();
    }
  }).catch(e => {
    console.error('allowlist check:', e);
    toast('Access check failed — try again');
  });
}

function writePendingRequest(user) {
  const ek = emailKey(user.email);
  _db.ref(`${DB_PATH}/pending/${ek}`).set({
    name: user.displayName || '',
    email: user.email,
    requestedAt: TS()
  }).catch(e => console.error('pending write:', e));
}

// While pending, listen for our own allowlist entry to flip to true (admin
// approved us). When it does, transition into the game.
function attachSelfAllowlistListener() {
  const ek = myEmailKey(); if (!ek) return;
  const ref = _db.ref(`${DB_PATH}/allowlist/${ek}`);
  _selfAllowlistListener = ref;
  ref.on('value', snap => {
    if (snap.val() !== true) return;
    ref.off();
    _selfAllowlistListener = null;
    // Clean up our pending entry in case admin approved without removing it.
    _db.ref(`${DB_PATH}/pending/${ek}`).remove().catch(() => {});
    try { localStorage.removeItem('kolache_requested'); } catch(e) {}
    S.authStatus = 'allowed';
    ensurePlayerRecord(S.authUser);
    attachDataListeners();
    renderAll();
  });
}

function ensurePlayerRecord(user) {
  const ref = _db.ref(`${DB_PATH}/players/${user.uid}`);
  ref.once('value').then(snap => {
    if (snap.exists()) return;
    ref.set({
      name: user.displayName || user.email || 'Player',
      balance: DOUGH_START,
      wins: 0,
      losses: 0,
      joinedAt: TS()
    }).catch(e => console.error('ensurePlayer:', e));
  }).catch(e => console.error('ensurePlayer check:', e));
}

function attachDataListeners() {
  if (_dataListenersAttached) return;
  _dataListenersAttached = true;

  _db.ref(`${DB_PATH}/players`).on('value', snap => {
    applySnap(snap, 'players');
    renderAll();
  }, e => console.error('players sub:', e));

  _db.ref(`${DB_PATH}/wagers`).on('value', snap => {
    applySnap(snap, 'wagers');
    renderAll();
  }, e => console.error('wagers sub:', e));

  if (isAdmin()) {
    _db.ref(`${DB_PATH}/pending`).on('value', snap => {
      S.pending = snap.val() || {};
      renderAll();
    }, e => console.error('pending sub:', e));
    _db.ref(`${DB_PATH}/allowlist`).on('value', snap => {
      S.allowlist = snap.val() || {};
    }, e => console.error('allowlist sub:', e));
  }
}

function detachDataListeners() {
  if (!_db) return;
  _db.ref(`${DB_PATH}/players`).off();
  _db.ref(`${DB_PATH}/wagers`).off();
  _db.ref(`${DB_PATH}/pending`).off();
  _db.ref(`${DB_PATH}/allowlist`).off();
  if (_selfAllowlistListener) { _selfAllowlistListener.off(); _selfAllowlistListener = null; }
  _dataListenersAttached = false;
  S.players = {}; S.wagers = {}; S.pending = {}; S.allowlist = {};
}

function initSync() {
  // Render the spinner immediately so the screen is never blank.
  renderAll();

  try {
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.database(app);
  } catch (e) {
    console.error('Firebase init failed:', e);
    return;
  }

  // The auth state callback drives everything. It fires once on load (with
  // null or the cached user) and again on every sign-in/sign-out.
  firebase.auth().onAuthStateChanged(user => {
    S.authUser = user || null;
    if (!user) {
      // If this device previously submitted a request, show the "thanks,
      // come back and sign in" screen instead of the request form.
      let prev = null;
      try { prev = localStorage.getItem('kolache_requested'); } catch(e) {}
      S.authStatus = prev ? 'requested' : 'signedout';
      detachDataListeners();
      renderAll();
      return;
    }
    // We have a user; figure out whether they're allowlisted.
    S.authStatus = 'init';
    renderAll();
    handleSignedIn(user);
  });
}

// ── TOAST ─────────────────────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── INIT ──────────────────────────────────────────────────────────────────
initSync();
</script>
