<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kolache — Indy 500 2026</title>
<meta property="og:title" content="Kolache">
<meta property="og:description" content="Place your bets. Settle the score. Indy 500 2026.">
<meta property="og:image" content="https://kolache-e58fa.web.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4efe4;
  --surface: #fffdf7;
  --border: #e0d8cc;
  --border-faint: #ebe5da;
  --text-1: #1a1a1a;
  --text-2: #4a4540;
  --text-3: #8a8580;
  --accent: #1a1a1a;
  --yes: #1a6b3c;
  --yes-light: #e6f2eb;
  --yes-border: #9acbab;
  --no: #c23028;
  --no-light: #fce8e7;
  --no-border: #e8a09c;
  --dough: #d4a017;
  --warn: #854d0e;
  --warn-bg: #fef9c3;
  --dispute: #7a1f1f;
  --dispute-bg: #fde7e7;
  --pending: #3a4a5c;
  --pending-bg: #e8ecf2;
}

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: #1a1a1a;
  border-bottom: none;
  height: 56px;
  padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #1a6b3c 25%, #d4a017 25%, #d4a017 50%, #c23028 50%, #c23028 75%, #1a1a1a 75%);
}
.logo {
  font-family: 'Lora', serif;
  font-size: 22px; font-weight: 700; letter-spacing: 1px;
  color: #fffdf7;
}
.player-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 0; border: none; border-radius: 0;
  background: none;
  cursor: pointer;
  font-family: 'Barlow', sans-serif;
  color: #fff;
}
.player-pill:active { opacity: .8; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: #3a3530; color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; letter-spacing: .3px;
}
.pill-dough { color: var(--dough); font-size: 14px; font-weight: 700; white-space: nowrap; }
.pill-name { display: none; }
.pill-caret { display: none; }

/* ── TAB BAR ── */
.tab-bar {
  position: sticky; top: 56px; z-index: 49;
  background: #2a2a2a;
  border-bottom: none;
  display: flex; padding: 0 4px;
  overflow-x: auto; scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  padding: 13px 14px 11px;
  font-family: 'Barlow', sans-serif;
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,.5);
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.tab.active { color: #fff; border-bottom-color: #fff; }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 1;
  margin-left: 4px; vertical-align: middle;
  font-family: 'Barlow', sans-serif;
}

/* ── VIEWS ── */
.view { display: none; padding: 16px; max-width: 580px; margin: 0 auto; padding-bottom: 100px; }
.view.active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.wgr-category {
  font-family: 'Barlow', sans-serif;
  font-size: 10px; font-weight: 600; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 8px;
}
.wgr-question {
  font-family: 'Lora', serif;
  font-style: normal;
  font-size: 17px; font-weight: 400; line-height: 1.4;
  color: var(--text-1); margin-bottom: 10px;
}
.wgr-subline {
  font-size: 12px; color: var(--text-3); margin-bottom: 18px;
  line-height: 1.5;
}
.pool-viz { margin-bottom: 18px; }
.pool-bar {
  height: 10px; border-radius: 2px;
  background: var(--no-light);
  overflow: hidden; margin-bottom: 6px;
  border: 1px solid var(--border);
}
.pool-bar-yes {
  height: 100%; border-radius: 1px;
  background: var(--yes);
  transition: width .4s ease;
  min-width: 2px;
}
.pool-labels {
  display: flex; justify-content: space-between;
  font-size: 13px;
}
.pool-label.yes { color: var(--yes); font-weight: 500; }
.pool-label.no  { color: var(--no);  font-weight: 500; }

/* ── WAGER LINE ── */
.wgr-line {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--text-2);
  padding: 6px 0;
}
.wgr-line strong { color: var(--text-1); font-weight: 600; }
.wgr-line + .wgr-line { border-top: 1px solid var(--border-faint); }
.side-chip {
  display: inline-block;
  padding: 2px 9px; border-radius: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: .8px;
  font-family: 'Lora', serif;
}
.side-chip.yes { background: var(--yes-light); color: var(--yes); }
.side-chip.no  { background: var(--no-light);  color: var(--no); }

/* ── TAKE BUTTON ── */
.btn-take {
  width: 100%; margin-top: 12px;
  padding: 12px 0;
  border-radius: 4px;
  font-family: 'Lora', serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1.5px solid;
  transition: opacity .1s, transform .1s;
  text-transform: uppercase;
  letter-spacing: .8px;
}
.btn-take:active { opacity: .8; transform: scale(.99); }
.btn-take.yes { background: var(--yes-light); color: var(--yes); border-color: var(--yes-border); }
.btn-take.no  { background: var(--no-light);  color: var(--no);  border-color: var(--no-border); }

/* ── META ── */
.wgr-meta {
  display: flex; flex-wrap: wrap; gap: 8px;
  font-size: 12px; color: var(--text-3); margin-top: 10px;
}
.badge-overdue {
  display: inline-block; padding: 1px 7px; border-radius: 3px;
  background: var(--warn-bg); color: var(--warn);
  font-size: 10px; font-weight: 600; letter-spacing: .5px;
  font-family: 'Lora', serif; text-transform: uppercase;
}
.badge-pending {
  display: inline-block; padding: 1px 7px; border-radius: 3px;
  background: var(--pending-bg); color: var(--pending);
  font-size: 10px; font-weight: 600; letter-spacing: .5px;
  font-family: 'Lora', serif; text-transform: uppercase;
}
.badge-disputed {
  display: inline-block; padding: 1px 7px; border-radius: 3px;
  background: var(--dispute-bg); color: var(--dispute);
  font-size: 10px; font-weight: 600; letter-spacing: .5px;
  font-family: 'Lora', serif; text-transform: uppercase;
}

/* ── MY BETS STRIP ── */
.my-bets {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-faint);
  display: flex; flex-direction: column; gap: 4px;
}
.my-bet-line {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--text-2);
}
.bet-pos-amt { color: var(--yes); font-weight: 600; }
.bet-neg-amt { color: var(--no);  font-weight: 600; }

/* ── ACTION STRIP (resolve / cancel / propose / re-propose) ── */
.action-strip {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-faint);
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap;
}
.action-label { font-size: 12px; color: var(--text-3); flex: 1; min-width: 120px; }
.btn-action {
  padding: 6px 14px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface);
  font-family: 'Barlow', sans-serif;
  font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer;
}
.btn-action:active { opacity: .8; }
.btn-confirm {
  padding: 6px 14px; border-radius: 4px;
  border: 1px solid var(--yes-border); background: var(--yes-light);
  font-family: 'Barlow', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--yes); cursor: pointer;
}
.btn-dispute {
  padding: 6px 14px; border-radius: 4px;
  border: 1px solid var(--no-border); background: var(--no-light);
  font-family: 'Barlow', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--no); cursor: pointer;
}
.btn-confirm:active, .btn-dispute:active { opacity: .8; }
.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: 24px; right: 16px;
  height: 48px; padding: 0 18px; border-radius: 24px;
  background: #2a2520; color: #fffdf7;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: 'Barlow', sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: .3px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
  z-index: 48; transition: transform .15s;
}
.fab:active { transform: scale(.94); }

/* ── SHEET ── */
.backdrop {
  position: fixed; inset: 0; background: transparent;
  z-index: 100; pointer-events: none; transition: background .25s;
}
.backdrop.open { background: rgba(0,0,0,.35); pointer-events: all; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 14px 14px 0 0;
  z-index: 101;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  max-height: 92vh; overflow-y: auto;
  overscroll-behavior: contain;
  border-top: 3px solid #1a1a1a;
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 12px auto;
}
.sheet-body { padding: 4px 20px 44px; }
.sheet-title {
  font-family: 'Lora', serif;
  font-size: 22px; font-weight: 600;
  color: var(--text-1); margin-bottom: 18px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.sheet-sub {
  font-family: 'Barlow', sans-serif;
  font-size: 15px; color: var(--text-2);
  line-height: 1.5; margin-bottom: 16px;
}

/* Forms */
.field { margin-bottom: 14px; }
.field-label {
  display: block;
  font-family: 'Lora', serif;
  font-size: 12px; font-weight: 600; letter-spacing: .8px;
  color: var(--text-2); margin-bottom: 6px;
  text-transform: uppercase;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  font-family: 'Barlow', sans-serif;
  font-size: 15px; color: var(--text-1);
  background: var(--bg); outline: none;
  transition: border-color .15s;
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
.helper { font-size: 12px; color: var(--text-3); margin-top: 5px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two-col .field-label { margin-bottom: 6px; }

.side-toggle { display: flex; gap: 8px; }
.side-btn {
  flex: 1; padding: 11px 0;
  border-radius: 4px;
  font-family: 'Lora', serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text-3);
  transition: border-color .12s, color .12s, background .12s;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.side-btn.on.yes { background: var(--yes-light); color: var(--yes); border-color: var(--yes-border); }
.side-btn.on.no  { background: var(--no-light);  color: var(--no);  border-color: var(--no-border); }

.btn-primary {
  width: 100%; padding: 14px;
  border-radius: 4px; border: none;
  font-family: 'Lora', serif;
  font-size: 16px; font-weight: 600;
  cursor: pointer; color: #fff; background: var(--accent);
  transition: opacity .15s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-primary:active { opacity: .8; }

/* Player list */
.pli {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; margin-bottom: 7px;
  cursor: pointer; font-family: 'Barlow', sans-serif; text-align: left;
}
.pli:active { background: #f0eeeb; }
.pli.current { border-left: 2px solid var(--accent); background: #faf5f0; }
.pli-name { flex: 1; font-size: 15px; font-weight: 500; }
.pli-bal  { font-size: 13px; font-weight: 600; color: var(--dough); }

/* Info box */
.info-box {
  background: var(--bg); border-radius: 4px;
  padding: 12px 14px; margin-bottom: 16px;
  border-left: 2px solid var(--accent);
}
.info-row {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--text-2); padding: 2px 0;
}
.info-row strong { color: var(--text-1); }

/* Resolve btns */
.resolve-btns { display: flex; gap: 10px; margin-top: 4px; }
.btn-ryes, .btn-rno {
  flex: 1; padding: 14px; border-radius: 4px;
  font-family: 'Lora', serif;
  font-size: 16px; font-weight: 700; cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.btn-ryes { background: var(--yes-light); color: var(--yes); border: 1.5px solid var(--yes-border); }
.btn-rno  { background: var(--no-light);  color: var(--no);  border: 1.5px solid var(--no-border); }
.btn-ryes:active, .btn-rno:active { opacity: .8; }

/* ── STANDINGS ── */
.standing {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 4px; margin-bottom: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.07);
}
.standing.me { border-left-color: var(--accent); background: #faf5f0; }
.standing:first-child { border-left: 3px solid var(--border); }
.rank { font-family: 'Lora', serif; font-size: 20px; font-weight: 700; color: var(--text-3); width: 28px; flex-shrink: 0; }
.rank.gold   { color: var(--dough); }
.rank.silver { color: #8a8a8a; }
.rank.bronze { color: #a0622e; }
.s-info { flex: 1; min-width: 0; }
.s-name   { font-size: 15px; font-weight: 600; font-family: 'Lora', serif; }
.s-record { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.s-bal    { font-family: 'Lora', serif; font-size: 17px; font-weight: 700; color: var(--dough); white-space: nowrap; }

/* ── RESOLVED ── */
.res-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: .8px;
  font-family: 'Lora', serif;
}
.badge-yes { background: var(--yes-light); color: var(--yes); }
.badge-no  { background: var(--no-light);  color: var(--no); }

.card-resolved {
  position: relative;
  overflow: hidden;
}
.card-resolved::before {
  display: none;
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 40px; height: 40px;
  background-image:
    linear-gradient(45deg, #1a1a1a 25%, transparent 25%),
    linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
    linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
  background-size: 10px 10px;
  background-position: 0 0, 0 0, 5px 0, 5px 0;
  background-color: #fff;
  opacity: .08;
  border-radius: 0 10px 0 0;
}

/* ── EMPTY ── */
.empty { text-align: center; padding: 48px 20px; color: var(--text-3); }
.empty-icon { font-size: 36px; margin-bottom: 8px; }
.empty-title { font-family: 'Lora', serif; font-size: 17px; color: var(--text-2); margin-bottom: 6px; }
.empty-desc  { font-size: 14px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 84px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #1a1a1a; color: #fffdf7;
  padding: 9px 18px; border-radius: 20px;
  font-family: 'Barlow', sans-serif;
  font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 2000; white-space: nowrap;
  max-width: calc(100vw - 40px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

hr { border: none; border-top: 1px solid var(--border-faint); margin: 14px 0; }

/* ── POOL / VOTE / RESOLVE ── */
.pool-summary { display: flex; gap: 10px; margin: 10px 0; }
.pool-side { flex: 1; padding: 10px; border-radius: 4px; text-align: center; font-size: 13px; font-family: 'Lora', serif; }
.pool-side.yes { background: var(--yes-light); color: var(--yes); border: 1px solid var(--yes-border); }
.pool-side.no  { background: var(--no-light);  color: var(--no);  border: 1px solid var(--no-border); }
.type-chip { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-left: 6px; font-family: 'Barlow', sans-serif; border: 1.5px solid; }
.type-chip.pool { background: #fef6e0; color: #8a6d1b; border-color: #d4a017; }
.type-chip.wager { background: #e8eef4; color: #3a5068; border-color: #8aa8c4; }
.vote-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.btn-vote { padding: 6px 14px; border-radius: 4px; border: 1.5px solid var(--border); background: var(--surface); font-family: 'Lora', serif; font-size: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: .5px; }
.btn-vote.yes { border-color: var(--yes-border); color: var(--yes); }
.btn-vote.no  { border-color: var(--no-border);  color: var(--no); }
.btn-vote.voted { font-weight: 700; }
.btn-vote.yes.voted { background: var(--yes-light); }
.btn-vote.no.voted  { background: var(--no-light); }
.resolve-row { display: flex; gap: 10px; margin: 10px 0; }
.filter-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.filter-btn {
  padding: 5px 12px; border-radius: 4px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: 'Lora', serif;
  font-size: 12px; font-weight: 500;
  color: var(--text-3); cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.filter-btn.on {
  border-color: #1a1a1a; color: #fff;
  background: #1a1a1a; font-weight: 600;
}
.option-chips {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 10px; min-height: 0;
}
.option-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: 16px;
  background: var(--bg); border: 1px solid var(--border);
  font-size: 13px; font-weight: 500; color: var(--text-1);
}
.option-chip button {
  background: none; border: none; cursor: pointer;
  font-size: 16px; line-height: 1; color: var(--text-3);
  padding: 0 0 0 2px;
}
.option-chip button:active { color: var(--no); }
.participants-sides {
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border-faint);
  display: flex; flex-direction: column; gap: 10px;
}
.side-group {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
.side-label {
  font-family: 'Lora', serif;
  font-size: 10px; font-weight: 700; letter-spacing: .8px;
  padding: 1px 6px; border-radius: 3px;
  flex-shrink: 0;
}
.side-label.yes { background: var(--yes-light); color: var(--yes); }
.side-label.no  { background: var(--no-light);  color: var(--no); }
.participant {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--text-2);
}
.participant-amt {
  font-size: 11px; color: var(--text-3); font-weight: 500;
}
.avatar-sm {
  width: 18px; height: 18px; border-radius: 50%;
  color: #fff; font-size: 7px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* Join banner */
.join-banner {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  border-radius: 4px; padding: 11px 14px; margin-bottom: 12px;
  font-size: 13px; color: var(--text-2);
}
.btn-join {
  padding: 5px 13px; border-radius: 4px;
  border: 1px solid var(--accent);
  background: var(--accent); color: #fff;
  font-family: 'Lora', serif;
  font-size: 12px; font-weight: 600; cursor: pointer;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* ── AUTH SCREEN ─────────────────────────────────────────────────────────── */
.auth-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.auth-screen.show { display: flex; }
.auth-inner { max-width: 360px; width: 100%; text-align: center; }
.auth-logo {
  font-family: 'Lora', serif;
  font-size: 36px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-1);
  margin-bottom: 8px;
}
.auth-tag {
  font-size: 11px; color: var(--text-3);
  margin-bottom: 36px; letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Barlow', sans-serif;
  font-weight: 600;
}
.auth-msg {
  font-size: 15px; color: var(--text-2);
  margin-bottom: 18px; line-height: 1.55;
}
.auth-msg.subtle { font-size: 13px; color: var(--text-3); margin-top: 24px; }
.btn-google {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 22px; border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text-1);
  font-family: 'Barlow', sans-serif;
  font-size: 15px; font-weight: 500; cursor: pointer;
  transition: background .12s;
}
.btn-google:active { background: var(--bg); }
.btn-google svg { width: 18px; height: 18px; }
.btn-link {
  background: none; border: none;
  color: var(--text-3); cursor: pointer;
  font-family: 'Barlow', sans-serif;
  font-size: 13px; padding: 8px 12px;
}
.btn-link:hover { color: var(--text-2); }
.auth-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.auth-form {
  display: flex; flex-direction: column; gap: 10px;
  margin-bottom: 16px;
}
.auth-form input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  font-family: 'Barlow', sans-serif;
  font-size: 15px; color: var(--text-1);
  background: var(--surface); outline: none;
  -webkit-appearance: none; appearance: none;
}
.auth-form input:focus { border-color: var(--accent); }
.auth-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--text-3); font-size: 11px;
  letter-spacing: .15em; text-transform: uppercase;
  margin: 28px 0 16px;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.btn-primary-auth {
  display: block; width: 100%;
  padding: 13px 20px; border-radius: 4px;
  border: none; background: var(--yes); color: #fff;
  font-family: 'Lora', serif;
  font-size: 16px; font-weight: 600; cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-primary-auth:active { opacity: .85; }
.btn-google.full {
  display: flex; width: 100%;
  justify-content: center;
}
.auth-section-label {
  font-family: 'Lora', serif;
  font-size: 11px; font-weight: 600; letter-spacing: .22em;
  text-transform: uppercase; color: var(--text-3);
  margin-bottom: 12px;
}
.auth-error {
  background: var(--no-light);
  color: var(--no);
  border: 1px solid var(--no-border);
  border-left: 3px solid var(--no);
  padding: 10px 14px;
  border-radius: 4px;
  font-size: 13px;
  margin-top: 12px;
  text-align: left;
  word-break: break-word;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">Kolache</div>
  <button class="player-pill" id="pill" onclick="openPlayerList()">
    <span id="pillInner">Select Player</span>
    <svg class="pill-caret" width="10" height="6" viewBox="0 0 10 6" fill="none">
      <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<nav class="tab-bar">
  <button class="tab active" onclick="switchTab(this,'bets')">🎲 Bets</button>
  <button class="tab" onclick="switchTab(this,'standings')">🏆 Standings</button>
  <button class="tab" onclick="switchTab(this,'resolved')">🏁 Resolved</button>
  <button class="tab" id="adminTab" style="display:none" onclick="switchTab(this,'admin')">⚙️ Admin</button>
</nav>

<div class="view active" id="v-bets"></div>
<div class="view" id="v-standings"></div>
<div class="view" id="v-resolved"></div>
<div class="view" id="v-admin"></div>

<!-- Auth gate: covers everything until the user signs in and is allowlisted. -->
<div class="auth-screen" id="authScreen">
  <div class="auth-inner">
    <div class="auth-logo">🏁 Kolache 🏁</div>
    <div class="auth-tag">FRIENDS-ONLY WAGERING · EST. 2026</div>
    <div id="authBody"></div>
  </div>
</div>

<button class="fab" id="fab" onclick="openCreateWager()">
  <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
    <path d="M9 2v14M2 9h14" stroke="#fffdf7" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  Add Bet
</button>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── STATE ─────────────────────────────────────────────────────────────────
// Players and wagers are objects keyed by their RTDB key. Players are keyed
// by their Firebase Auth uid; wagers by push id. Each value carries an `id`
// field synthesized from the key. confirmedBy / disputedBy on a wager are
// objects keyed by playerId (uid) with `true` as the value.
const ADMIN_EMAIL = 'patrick.hermiller@gmail.com';
const S = {
  players: {},
  wagers:  {},
  allowlist: {},        // {emailKey: true} — synced from /kolache_v3/allowlist
  pending:   {},        // {emailKey: {name, email, requestedAt}} — admin sees these
  authUser:  null,      // firebase.User or null
  authStatus: 'init',   // 'init' | 'signedout' | 'pending' | 'allowed'
};
const DOUGH_START = 1000;
const CATS = ['Sports','Entertainment','Pop Culture','Finance','Science','Tech','Other'];

// ── UTILS ─────────────────────────────────────────────────────────────────
// RTDB keys can't contain `.`, so emails are stored with dots → commas.
const emailKey   = e => String(e || '').toLowerCase().replace(/\./g, ',');
const myUid      = () => S.authUser?.uid || null;
const myEmailKey = () => S.authUser ? emailKey(S.authUser.email) : null;
const isAdmin    = () => !!(S.authUser && S.authUser.email && S.authUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
const me         = () => myUid() && S.players[myUid()] ? S.players[myUid()] : null;
const esc  = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt  = n  => `${Math.round(n).toLocaleString()} dough`;
const initials = name => name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0,2);
const fmtDate  = d => { const dt = new Date(d); return isNaN(dt) ? '—' : dt.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); };
const overdue  = w => new Date(w.closeDate) < new Date();
const acceptanceList = w => w && w.acceptances ? Object.values(w.acceptances) : [];

// ── WAGER HELPERS ─────────────────────────────────────────────────────────
function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a); }
function impliedOdds(risk, win) {
  if (!risk || !win) return '—';
  if (risk === win) return 'Even';
  const g = gcd(risk, win) || 1;
  return `${risk/g}:${win/g}`;
}
function poolTaken(w)     { return acceptanceList(w).reduce((s, a) => s + a.takerStake, 0); }
function poolRemaining(w) { return Math.max(0, w.takerPool - poolTaken(w)); }
function isFilled(w)      { return poolRemaining(w) === 0; }
function proposerExposureFor(w, takerStake) {
  // Proposer's matched escrow for one acceptance, prorated against takerPool.
  return Math.round(takerStake * w.proposerStake / w.takerPool);
}
function parties(w) {
  const ids = new Set();
  if (w.proposerId != null) ids.add(w.proposerId);
  if ((w.type || 'wager') === 'pool') {
    for (const b of poolBetList(w)) ids.add(b.playerId);
  } else {
    for (const a of acceptanceList(w)) ids.add(a.takerId);
  }
  return [...ids];
}
function isParty(w, playerId) {
  if (playerId == null) return false;
  if (w.proposerId === playerId) return true;
  if ((w.type || 'wager') === 'pool') {
    return poolBetList(w).some(b => b.playerId === playerId);
  }
  return acceptanceList(w).some(a => a.takerId === playerId);
}

// ── POOL HELPERS ─────────────────────────────────────────────────────────
const OPTION_COLORS = ['#1a6b3c','#c23028','#2563eb','#d97706','#7c3aed','#0891b2','#be185d','#4d7c0f'];
function getOptions(w) { return w.options || ['YES','NO']; }
function poolBetList(w)         { return w && w.poolBets ? Object.values(w.poolBets) : []; }
function poolTotal(w)           { return poolBetList(w).reduce((s, b) => s + b.amount, 0); }
function poolSideTotal(w, side) { return poolBetList(w).filter(b => b.side === side).reduce((s, b) => s + b.amount, 0); }
function poolOptionTotal(w, option) { return poolBetList(w).filter(b => (b.option || b.side) === option).reduce((s, b) => s + b.amount, 0); }

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAll() {
  // Gate on auth — show the auth screen instead of the app until allowed.
  if (S.authStatus !== 'allowed') {
    renderAuthScreen();
    return;
  }
  document.getElementById('authScreen').classList.remove('show');
  renderPill();
  renderBets();
  renderStandings();
  renderResolved();
  renderAdmin();
  if (!S._tabRestored) { S._tabRestored = true; restoreTab(); }
}

const GOOGLE_ICON = `<svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.79 2.72v2.26h2.9c1.7-1.56 2.69-3.87 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.46-.8 5.95-2.18l-2.9-2.26c-.81.54-1.83.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7a5.41 5.41 0 0 1 0-3.4V4.96H.96a9 9 0 0 0 0 8.08l2.99-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>`;

function renderAuthScreen() {
  const screen = document.getElementById('authScreen');
  const body   = document.getElementById('authBody');
  screen.classList.add('show');
  if (S.authStatus === 'init') {
    body.innerHTML = `<div class="auth-spinner"></div>`;
    return;
  }
  if (S.authStatus === 'signedout') {
    // Request-to-join is the primary CTA. Sign-in is the secondary path
    // for already-approved users.
    //
    // iOS autofill quirks: read values via FormData (more reliable than
    // input.value right after autofill commits) and wire handlers with
    // addEventListener rather than inline onsubmit-via-innerHTML, which
    // iOS Safari sometimes ignores. We also attach the same handler to
    // the button's click event as a backup in case the form's submit
    // event doesn't fire for some reason.
    body.innerHTML = `
      <p class="auth-msg">Kolache is invite-only. Request access below and the admin will let you in.</p>
      <div class="auth-section-label">New here? Request access</div>
      <form id="reqForm" novalidate>
        <div class="auth-form">
          <input type="text"  id="reqName"  name="name"  placeholder="Your name" maxlength="40" autocomplete="name" autocapitalize="words">
          <input type="email" id="reqEmail" name="email" placeholder="Your Google email" autocomplete="email" inputmode="email">
        </div>
        <button type="submit" id="reqSubmit" class="btn-primary-auth">Request access</button>
        <div id="reqError" class="auth-error" style="display:none"></div>
      </form>
      <div class="auth-divider">or</div>
      <div class="auth-section-label">Already approved?</div>
      <button class="btn-google full" onclick="signIn()">${GOOGLE_ICON} Sign in with Google</button>
    `;
    const form = document.getElementById('reqForm');
    const go = (e) => { e.preventDefault(); submitRequest(form); return false; };
    form.addEventListener('submit', go);
    document.getElementById('reqSubmit').addEventListener('click', go);
    return;
  }
  if (S.authStatus === 'requested') {
    body.innerHTML = `
      <p class="auth-msg">Got it — your request was sent.</p>
      <p class="auth-msg">Once the admin approves you, come back here and sign in with Google using the same email.</p>
      <button class="btn-google full" onclick="signIn()">${GOOGLE_ICON} Sign in with Google</button>
      <button class="btn-link" onclick="backToRequest()" style="margin-top:6px">Use a different email</button>
    `;
    return;
  }
  if (S.authStatus === 'pending') {
    // Signed in via Google but not on the allowlist yet.
    const name = S.authUser?.displayName || S.authUser?.email || 'friend';
    body.innerHTML = `
      <p class="auth-msg">Hi, <strong>${esc(name)}</strong>.</p>
      <p class="auth-msg">Your access request was logged. You'll be let in once the admin approves you — this page will switch over automatically.</p>
      <button class="btn-link" onclick="signOut()">Sign out</button>
    `;
  }
}

// Guard against double-submit while a write is in flight.
let _submitInFlight = false;

function showReqError(msg) {
  const el = document.getElementById('reqError');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}
function clearReqError() {
  const el = document.getElementById('reqError');
  if (el) { el.style.display = 'none'; el.textContent = ''; }
}

// formEl is the <form> element (passed by the listener). FormData reads from
// the form's own snapshot of inputs, which is more reliable than .value
// immediately after iOS autofill commits.
function submitRequest(formEl) {
  if (_submitInFlight) return;
  formEl = formEl || document.getElementById('reqForm');
  clearReqError();

  // iOS autofill quirk: blur the active input so the autofill UI doesn't
  // capture the next tap. Reading FormData also forces Safari to "commit"
  // pending autofill values into the inputs' .value.
  try { document.activeElement?.blur(); } catch(e) {}

  const nameInput  = document.getElementById('reqName');
  const emailInput = document.getElementById('reqEmail');
  const fd = formEl ? new FormData(formEl) : null;

  // Belt-and-suspenders: prefer FormData, fall back to .value.
  let name  = (fd?.get('name')  || nameInput?.value  || '').toString().trim();
  let email = (fd?.get('email') || emailInput?.value || '').toString().trim().toLowerCase();

  if (!name)                          { showReqError('Please enter your name');         return; }
  if (!email || !email.includes('@')) { showReqError('Please enter a valid email');     return; }
  if (!_db)                           { showReqError('Not connected — refresh the page'); return; }

  // Immediate visible feedback so the user knows the tap registered, even
  // before the network round-trip completes. We don't transition state
  // until the write actually lands — that way a rules denial or network
  // failure surfaces a real error instead of a confusing flicker.
  const submitBtn = document.getElementById('reqSubmit');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    submitBtn.style.opacity = '0.7';
  }
  _submitInFlight = true;
  toast('Sending request…');

  const ek = emailKey(email);
  _db.ref(`${DB_PATH}/pending/${ek}`).set({
    name, email, requestedAt: TS()
  }).then(() => {
    _submitInFlight = false;
    try { localStorage.setItem('kolache_requested', email); } catch(e) {}
    S.authStatus = 'requested';
    renderAll();
    toast('Request sent!');
  }).catch(e => {
    _submitInFlight = false;
    console.error('submitRequest:', e);
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request access';
      submitBtn.style.opacity = '';
    }
    // Show the actual error inline. Toast also fires (z-index now correct)
    // but inline message stays visible until the user retries.
    const errCode = e?.code || e?.message || 'unknown';
    showReqError('Couldn\'t send request — ' + errCode);
    toast('Failed: ' + errCode);
  });
}

function backToRequest() {
  try { localStorage.removeItem('kolache_requested'); } catch(e) {}
  S.authStatus = 'signedout';
  renderAll();
}

function renderPill() {
  const p = me();
  document.getElementById('pillInner').innerHTML = p
    ? `<span class="avatar" style="background:${avatarColor(p.id)}">${initials(p.name)}</span>
       <span class="pill-name">${esc(p.name)}</span>
       <span class="pill-dough">${fmt(p.balance)}</span>`
    : `<span style="padding:0 4px;color:var(--text-2)">+ Join</span>`;
}

function joinBanner() {
  // Only reached briefly post-sign-in while we create the player record.
  return `<div class="join-banner">
    <span>Setting up your account…</span>
  </div>`;
}

function emptyState(title, desc, icon) {
  icon = icon || '🏟️';
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${esc(title)}</div><p class="empty-desc">${esc(desc)}</p></div>`;
}

let _betFilter = 'all';
function setBetFilter(f) { _betFilter = f; renderBets(); }

function renderBets() {
  const el = document.getElementById('v-bets');
  const player = me();
  const all = Object.values(S.wagers)
    .filter(w => w.status !== 'resolved')
    .sort((a, b) => (b.createdAt||0) - (a.createdAt||0));

  let filtered = all;
  if (_betFilter === 'mine' && player) {
    filtered = all.filter(w => isParty(w, player.id));
  } else if (_betFilter === 'open') {
    filtered = all.filter(w => {
      if (overdue(w) || w.status !== 'open') return false;
      if (!player) return true;
      const wtype = w.type || 'wager';
      if (wtype === 'pool') return true;
      return w.proposerId !== player.id && poolRemaining(w) > 0;
    });
  } else if (_betFilter === 'closing') {
    filtered = all.filter(w => overdue(w));
  }

  const banner = player ? '' : joinBanner();
  const filterBar = `<div class="filter-bar">
    <button class="filter-btn ${_betFilter === 'all' ? 'on' : ''}" onclick="setBetFilter('all')">All</button>
    <button class="filter-btn ${_betFilter === 'mine' ? 'on' : ''}" onclick="setBetFilter('mine')">My Bets</button>
    <button class="filter-btn ${_betFilter === 'open' ? 'on' : ''}" onclick="setBetFilter('open')">Bet Now</button>
    <button class="filter-btn ${_betFilter === 'closing' ? 'on' : ''}" onclick="setBetFilter('closing')">Needs Resolution</button>
  </div>`;

  if (!filtered.length) {
    el.innerHTML = banner + filterBar + emptyState('No bets match', 'Try a different filter or tap + to post one');
    return;
  }
  el.innerHTML = banner + filterBar + filtered.map(wagerCard).join('');
}

function renderParticipants(w) {
  const wtype = w.type || 'wager';
  const options = getOptions(w);
  const isYesNo = options.length === 2 && options[0] === 'YES' && options[1] === 'NO';

  if (wtype === 'pool' && !isYesNo) {
    // Multi-option pool: group by option
    const optionBuckets = {};
    for (const opt of options) optionBuckets[opt] = {};
    for (const b of poolBetList(w)) {
      const bOpt = b.option || b.side;
      if (!optionBuckets[bOpt]) optionBuckets[bOpt] = {};
      optionBuckets[bOpt][b.playerId] = (optionBuckets[bOpt][b.playerId] || 0) + b.amount;
    }
    let html = '';
    for (let i = 0; i < options.length; i++) {
      const opt = options[i];
      const color = OPTION_COLORS[i % OPTION_COLORS.length];
      const entries = Object.entries(optionBuckets[opt] || {});
      if (!entries.length) continue;
      const pHTML = entries.map(([id, amt]) => {
        const p = S.players[id]; if (!p) return '';
        return `<span class="participant"><span class="avatar-sm" style="background:${avatarColor(id)}">${initials(p.name)}</span>${esc(p.name)} <span class="participant-amt">${fmt(amt)}</span></span>`;
      }).join('');
      html += `<div class="side-group"><span class="side-label" style="background:${color}20;color:${color}">${esc(opt)}</span>${pHTML}</div>`;
    }
    return html ? `<div class="participants-sides">${html}</div>` : '';
  }

  // YES/NO pools and standard wagers
  const yesSide = {};
  const noSide = {};

  if (wtype === 'pool') {
    for (const b of poolBetList(w)) {
      const bOpt = b.option || b.side;
      const bucket = bOpt === 'YES' ? yesSide : noSide;
      bucket[b.playerId] = (bucket[b.playerId] || 0) + b.amount;
    }
  } else {
    if (w.proposerId) {
      const bucket = w.proposerSide === 'YES' ? yesSide : noSide;
      bucket[w.proposerId] = w.proposerStake || 0;
    }
    for (const a of acceptanceList(w)) {
      const otherSide = w.proposerSide === 'YES' ? noSide : yesSide;
      otherSide[a.takerId] = (otherSide[a.takerId] || 0) + a.takerStake;
    }
  }

  const renderSide = (map, side) => {
    const entries = Object.entries(map);
    if (!entries.length) return '';
    return entries.map(([id, amt]) => {
      const p = S.players[id];
      if (!p) return '';
      return `<span class="participant ${side.toLowerCase()}"><span class="avatar-sm" style="background:${avatarColor(id)}">${initials(p.name)}</span>${esc(p.name)} <span class="participant-amt">${fmt(amt)}</span></span>`;
    }).join('');
  };

  const yesHTML = renderSide(yesSide, 'YES');
  const noHTML  = renderSide(noSide, 'NO');
  if (!yesHTML && !noHTML) return '';

  return `<div class="participants-sides">
    ${yesHTML ? `<div class="side-group yes"><span class="side-label yes">YES</span>${yesHTML}</div>` : ''}
    ${noHTML  ? `<div class="side-group no"><span class="side-label no">NO</span>${noHTML}</div>` : ''}
  </div>`;
}

function wagerCard(w) {
  const wtype = w.type || 'wager';
  return wtype === 'pool' ? wagerCardPool(w) : wagerCardStandard(w);
}

function renderVoteArea(w, player) {
  const past = overdue(w);
  if (!past || w.status !== 'open') return '';
  const isMine = player && player.id === w.proposerId;
  const proposer = S.players[w.proposerId];
  const options = getOptions(w);
  const isYesNo = options.length === 2 && options[0] === 'YES' && options[1] === 'NO';
  const votes = w.votes || {};

  let tally = '';
  if (Object.keys(votes).length) {
    const voteCounts = {};
    for (const v of Object.values(votes)) voteCounts[v] = (voteCounts[v] || 0) + 1;
    tally = `<div style="font-size:12px;color:var(--text-3);margin:4px 0">Votes: ${Object.entries(voteCounts).map(([k,v]) => `${v} ${esc(k)}`).join(', ')}</div>`;
  }

  if (isMine) {
    if (isYesNo) {
      return `<div class="action-strip">
        <span class="action-label">Past close date — resolve</span>
        <div class="resolve-row">
          <button class="btn-ryes" onclick="resolve('${w.id}','YES')">Resolve YES</button>
          <button class="btn-rno"  onclick="resolve('${w.id}','NO')">Resolve NO</button>
        </div>
      </div>${tally}`;
    }
    return `<div class="action-strip" style="flex-direction:column;align-items:stretch">
      <span class="action-label">Past close date — pick the winner</span>
      <div class="resolve-row" style="flex-wrap:wrap">${options.map((opt, i) => {
        const c = OPTION_COLORS[i % OPTION_COLORS.length];
        return `<button class="btn-ryes" style="background:${c}18;color:${c};border-color:${c}88" onclick="resolve('${w.id}','${esc(opt)}')">${esc(opt)}</button>`;
      }).join('')}</div>
    </div>${tally}`;
  }
  if (player) {
    const myVote = votes[player.id] || null;
    if (isYesNo) {
      const yVoted = myVote === 'YES' ? ' voted' : '';
      const nVoted = myVote === 'NO'  ? ' voted' : '';
      return `<div class="action-strip">
        <span class="action-label">Waiting for ${esc(proposer?.name || 'creator')} to resolve</span>
        <div class="vote-row">
          <button class="btn-vote yes${yVoted}" onclick="castVote('${w.id}','YES')">YES</button>
          <button class="btn-vote no${nVoted}"  onclick="castVote('${w.id}','NO')">NO</button>
        </div>
      </div>${tally}`;
    }
    return `<div class="action-strip" style="flex-direction:column;align-items:stretch">
      <span class="action-label">Waiting for ${esc(proposer?.name || 'creator')} to resolve</span>
      <div class="vote-row" style="flex-wrap:wrap">${options.map((opt, i) => {
        const c = OPTION_COLORS[i % OPTION_COLORS.length];
        const voted = myVote === opt ? ' voted' : '';
        return `<button class="btn-vote${voted}" style="border-color:${c}88;color:${c}${voted ? ';background:' + c + '18' : ''}" onclick="castVote('${w.id}','${esc(opt)}')">${esc(opt)}</button>`;
      }).join('')}</div>
    </div>${tally}`;
  }
  return tally;
}

function wagerCardStandard(w) {
  const player    = me();
  const proposer  = S.players[w.proposerId];
  const isMine    = player && player.id === w.proposerId;
  const remaining = poolRemaining(w);
  const past      = overdue(w);

  const otherSide  = w.proposerSide === 'YES' ? 'NO' : 'YES';
  const proposerCl = w.proposerSide === 'YES' ? 'yes' : 'no';
  const otherCl    = otherSide === 'YES' ? 'yes' : 'no';

  const myTakes   = player ? acceptanceList(w).filter(a => a.takerId === player.id) : [];
  const myStaked  = myTakes.reduce((s, a) => s + a.takerStake, 0);
  const hasAcceptances = acceptanceList(w).length > 0;

  const canTake = player && !isMine && remaining > 0 && !past && w.status === 'open';

  // ── meta line
  const meta = [
    `${fmt(poolTaken(w))} / ${fmt(w.takerPool)} matched`,
    `Closes ${fmtDate(w.closeDate)}`,
    past && w.status === 'open' ? `<span class="badge-overdue">Needs resolution</span>` : '',
  ].filter(Boolean).join(' · ');

  // ── action area
  let action = '';
  if (canTake) {
    action = `<button class="btn-take ${otherCl}" onclick="openAccept('${w.id}')">
      Take ${otherSide} &nbsp;·&nbsp; ${fmt(remaining)} left
    </button>`;
  } else if (isMine && !hasAcceptances && w.status === 'open' && !past) {
    action = `<div class="action-strip">
      <span class="action-label">No takers yet — your dough is held</span>
      <button class="btn-action" onclick="cancelWager('${w.id}')">Cancel</button>
    </div>`;
  } else if (past && w.status === 'open') {
    action = renderVoteArea(w, player);
  }

  // ── my position strip
  let mine = '';
  if (myStaked) {
    mine = `<div class="my-bets">
      <div class="my-bet-line">
        <span>You took ${otherSide}</span>
        <span class="bet-${otherCl === 'yes' ? 'pos' : 'neg'}-amt">${fmt(myStaked)}</span>
      </div>
    </div>`;
  } else if (isMine) {
    mine = `<div class="my-bets">
      <div class="my-bet-line">
        <span>Your side</span>
        <span class="side-chip ${proposerCl}">${w.proposerSide}</span>
      </div>
    </div>`;
  }

  const editBtn = isAdmin() && w.status === 'open' ? `<span style="display:flex;gap:10px"><button class="btn-link" style="font-size:12px;padding:0" onclick="openEditWager('${w.id}')">Edit</button><button class="btn-link" style="font-size:12px;padding:0;color:var(--no)" onclick="deleteWager('${w.id}')">Delete</button></span>` : '';
  const matched = poolTaken(w);
  const sub = [`${impliedOdds(w.proposerStake, w.takerPool)} odds`,
    `${fmt(matched)} / ${fmt(w.takerPool)} matched`,
    fmtDate(w.closeDate)].join(' · ');

  return `<div class="card">
    <div class="wgr-category" style="display:flex;justify-content:space-between;align-items:center">
      <span>${esc(w.category)} <span class="type-chip wager">1-on-1</span></span>
      ${editBtn}
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-subline">${sub}${past && w.status === 'open' ? ' · <span class="badge-overdue">Needs resolution</span>' : ''}</div>
    ${renderParticipants(w)}
    ${action}
  </div>`;
}

function wagerCardPool(w) {
  const player   = me();
  const proposer = S.players[w.proposerId];
  const isMine   = player && player.id === w.proposerId;
  const past     = overdue(w);
  const options  = getOptions(w);
  const isYesNo  = options.length === 2 && options[0] === 'YES' && options[1] === 'NO';

  const total    = poolTotal(w);

  const myBets = player ? poolBetList(w).filter(b => b.playerId === player.id) : [];
  const canBet = player && !past && w.status === 'open';

  // action — lock to their option if they already bet
  const myExistingOption = player ? ((b => b ? (b.option || b.side) : null)(poolBetList(w).find(b => b.playerId === player.id))) : null;
  let action = '';
  if (canBet) {
    if (myExistingOption) {
      const optIdx = options.indexOf(myExistingOption);
      const optColor = OPTION_COLORS[(optIdx >= 0 ? optIdx : 0) % OPTION_COLORS.length];
      if (isYesNo) {
        action = `<div style="margin-top:12px">
          <button class="btn-take ${myExistingOption.toLowerCase()}" style="width:100%" onclick="openPlacePoolBet('${w.id}','${esc(myExistingOption)}')">Add more on ${esc(myExistingOption)}</button>
        </div>`;
      } else {
        action = `<div style="margin-top:12px">
          <button class="btn-take" style="width:100%;background:${optColor}18;color:${optColor};border-color:${optColor}88" onclick="openPlacePoolBet('${w.id}','${esc(myExistingOption)}')">Add more on ${esc(myExistingOption)}</button>
        </div>`;
      }
    } else if (isYesNo) {
      action = `<div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn-take yes" style="flex:1" onclick="openPlacePoolBet('${w.id}','YES')">Bet YES</button>
        <button class="btn-take no"  style="flex:1" onclick="openPlacePoolBet('${w.id}','NO')">Bet NO</button>
      </div>`;
    } else {
      action = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${options.map((opt, i) => {
        const c = OPTION_COLORS[i % OPTION_COLORS.length];
        return `<button class="btn-take" style="flex:1;min-width:120px;background:${c}18;color:${c};border-color:${c}88" onclick="openPlacePoolBet('${w.id}','${esc(opt)}')">${esc(opt)}</button>`;
      }).join('')}</div>`;
    }
  } else if (past && w.status === 'open') {
    action = renderVoteArea(w, player);
  }

  // my pool bets
  let mine = '';
  if (myBets.length) {
    mine = `<div class="my-bets">${myBets.map(b => {
      const bOpt = b.option || b.side;
      const optIdx = options.indexOf(bOpt);
      if (isYesNo) {
        const cl = bOpt === 'YES' ? 'pos' : 'neg';
        return `<div class="my-bet-line"><span>You bet ${esc(bOpt)}</span><span class="bet-${cl}-amt">${fmt(b.amount)}</span></div>`;
      }
      const c = OPTION_COLORS[(optIdx >= 0 ? optIdx : 0) % OPTION_COLORS.length];
      return `<div class="my-bet-line"><span>You bet <span style="color:${c};font-weight:600">${esc(bOpt)}</span></span><span style="color:${c};font-weight:600">${fmt(b.amount)}</span></div>`;
    }).join('')}</div>`;
  }

  const editBtn = isAdmin() && w.status === 'open' ? `<span style="display:flex;gap:10px"><button class="btn-link" style="font-size:12px;padding:0" onclick="openEditWager('${w.id}')">Edit</button><button class="btn-link" style="font-size:12px;padding:0;color:var(--no)" onclick="deleteWager('${w.id}')">Delete</button></span>` : '';
  const sub = [fmtDate(w.closeDate)].join(' · ');

  // Pool visualization
  let poolViz = '';
  if (isYesNo) {
    const yesTotal = poolOptionTotal(w, 'YES');
    const noTotal  = poolOptionTotal(w, 'NO');
    poolViz = `<div class="pool-viz">
      <div class="pool-bar">
        <div class="pool-bar-yes" style="width:${total ? Math.round(yesTotal/total*100) : 50}%"></div>
      </div>
      <div class="pool-labels">
        <span class="pool-label yes"><strong>${total ? Math.round(yesTotal/total*100) : 50}%</strong> YES · ${fmt(yesTotal)}</span>
        <span class="pool-label no">${fmt(noTotal)} · NO <strong>${total ? Math.round(noTotal/total*100) : 50}%</strong></span>
      </div>
    </div>`;
  } else {
    const optionEmojis = ['\u{1F535}','\u{1F7E0}','\u{1F7E3}','\u{1F7E2}','\u{1F534}','\u{1F7E1}','\u{26AB}','\u{26AA}'];
    poolViz = `<div class="pool-viz" style="display:flex;flex-direction:column;gap:6px">${options.map((opt, i) => {
      const optTotal = poolOptionTotal(w, opt);
      const betCount = poolBetList(w).filter(b => (b.option || b.side) === opt).length;
      const c = OPTION_COLORS[i % OPTION_COLORS.length];
      const emoji = optionEmojis[i % optionEmojis.length];
      return `<div style="display:flex;align-items:center;gap:8px;font-size:14px">
        <span style="color:${c};font-size:16px">${emoji}</span>
        <span style="font-weight:600;color:${c};min-width:60px">${esc(opt)}</span>
        <span style="color:var(--text-2)">${fmt(optTotal)} (${betCount} bet${betCount !== 1 ? 's' : ''})</span>
      </div>`;
    }).join('')}</div>`;
  }

  return `<div class="card">
    <div class="wgr-category" style="display:flex;justify-content:space-between;align-items:center">
      <span>${esc(w.category)} <span class="type-chip pool">Pool</span></span>
      ${editBtn}
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-subline">${sub}${past && w.status === 'open' ? ' · <span class="badge-overdue">Needs resolution</span>' : ''}</div>
    ${poolViz}
    ${renderParticipants(w)}
    ${action}
    ${mine}
  </div>`;
}


function renderStandings() {
  const el = document.getElementById('v-standings');
  const players = Object.values(S.players);
  if (!players.length) {
    el.innerHTML = emptyState('No players yet', 'Add yourself to start the standings');
    return;
  }
  const sorted = [...players].sort((a,b) => (b.balance||0) - (a.balance||0));
  el.innerHTML = sorted.map((p,i) => {
    const tot = (p.wins||0) + (p.losses||0);
    const wr  = tot ? Math.round((p.wins||0)/tot*100) + '%' : '—';
    const net = (p.balance||0) - DOUGH_START;
    const netStr = (net >= 0 ? '+' : '') + net.toLocaleString();
    const rankCls = ['gold','silver','bronze'][i] ? `rank ${['gold','silver','bronze'][i]}` : 'rank';
    return `<div class="standing ${p.id === myUid() ? 'me' : ''}">
      <div class="${rankCls}">${i+1}</div>
      <div class="s-info">
        <div class="s-name">${esc(p.name)}${p.id === myUid() ? ' <span style="font-size:11px;color:var(--text-3)">(you)</span>' : ''}</div>
        <div class="s-record">${p.wins||0}W · ${p.losses||0}L · ${wr} · ${netStr} net</div>
      </div>
      <div class="s-bal">${fmt(p.balance||0)}</div>
    </div>`;
  }).join('');
}

function renderResolved() {
  const el = document.getElementById('v-resolved');
  const list = Object.values(S.wagers)
    .filter(w => w.status === 'resolved')
    .sort((a,b) => (b.resolvedAt||0) - (a.resolvedAt||0));
  if (!list.length) {
    el.innerHTML = emptyState('Nothing resolved yet', 'Settled bets will appear here');
    return;
  }
  const player = me();
  el.innerHTML = list.map(w => {
    const wtype = w.type || 'wager';
    if (wtype === 'pool') return renderResolvedPool(w, player);
    return renderResolvedWager(w, player);
  }).join('');
}

function renderResolvedWager(w, player) {
  const proposer = S.players[w.proposerId];
  const proposerWon = w.proposerSide === w.resolution;
  const myParty = player && isParty(w, player.id);
  const accs = acceptanceList(w);
  let myLine = '';
  if (myParty) {
    let net = 0;
    if (player.id === w.proposerId) {
      for (const a of accs) {
        const exp = proposerExposureFor(w, a.takerStake);
        net += proposerWon ? a.takerStake : -exp;
      }
    } else {
      const mine = accs.filter(a => a.takerId === player.id);
      for (const a of mine) {
        const exp = proposerExposureFor(w, a.takerStake);
        net += proposerWon ? -a.takerStake : exp;
      }
    }
    const cls  = net >= 0 ? 'bet-pos-amt' : 'bet-neg-amt';
    const sign = net >= 0 ? '+' : '−';
    myLine = `<div class="my-bets"><div class="my-bet-line">
      <span>Your result</span>
      <span class="${cls}">${sign}${fmt(Math.abs(net))}</span>
    </div></div>`;
  }
  return `<div class="card card-resolved">
    <div class="res-header">
      <div class="wgr-category" style="margin:0">${esc(w.category)}<span class="type-chip wager">1-on-1</span></div>
      <span class="badge badge-${w.resolution.toLowerCase()}">${w.resolution}</span>
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-meta">
      <span>${esc(proposer?.name || '?')} ${proposerWon ? 'won' : 'lost'} ${w.proposerSide}</span>
      <span>Resolved ${fmtDate(w.resolvedAt)}</span>
      <span>${accs.length} taker${accs.length !== 1 ? 's' : ''}</span>
    </div>
    ${myLine}
  </div>`;
}

function renderResolvedPool(w, player) {
  const proposer = S.players[w.proposerId];
  const total = poolTotal(w);
  const options = getOptions(w);
  const isYesNo = options.length === 2 && options[0] === 'YES' && options[1] === 'NO';
  const myParty = player && isParty(w, player.id);
  let myLine = '';
  if (myParty) {
    const myBets = poolBetList(w).filter(b => b.playerId === player.id);
    const winTotal = poolOptionTotal(w, w.resolution);
    const loseTotal = total - winTotal;
    let net = 0;
    for (const b of myBets) {
      const bOpt = b.option || b.side;
      if (bOpt === w.resolution) {
        if (loseTotal === 0) {
          // refund scenario — net 0
        } else {
          net += Math.floor(b.amount / winTotal * total) - b.amount;
        }
      } else {
        net -= b.amount;
      }
    }
    const cls  = net >= 0 ? 'bet-pos-amt' : 'bet-neg-amt';
    const sign = net >= 0 ? '+' : '−';
    myLine = `<div class="my-bets"><div class="my-bet-line">
      <span>Your result</span>
      <span class="${cls}">${sign}${fmt(Math.abs(net))}</span>
    </div></div>`;
  }

  // Resolution badge
  let resBadge = '';
  if (isYesNo) {
    resBadge = `<span class="badge badge-${w.resolution.toLowerCase()}">${esc(w.resolution)}</span>`;
  } else {
    const resIdx = options.indexOf(w.resolution);
    const c = OPTION_COLORS[(resIdx >= 0 ? resIdx : 0) % OPTION_COLORS.length];
    resBadge = `<span class="badge" style="background:${c}18;color:${c}">${esc(w.resolution)}</span>`;
  }

  return `<div class="card card-resolved">
    <div class="res-header">
      <div class="wgr-category" style="margin:0">${esc(w.category)}<span class="type-chip pool">Pool</span></div>
      ${resBadge}
    </div>
    <div class="wgr-question">${esc(w.question)}</div>
    <div class="wgr-meta">
      <span>Pot: ${fmt(total)}</span>
      <span>Resolved ${fmtDate(w.resolvedAt)}</span>
    </div>
    ${myLine}
  </div>`;
}

function renderAdmin() {
  const tabBtn = document.getElementById('adminTab');
  const el     = document.getElementById('v-admin');
  if (!isAdmin()) {
    tabBtn.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  tabBtn.style.display = '';
  const items = Object.entries(S.pending || {});
  const count = items.length;
  tabBtn.innerHTML = count
    ? `Admin <span class="tab-badge">${count}</span>`
    : 'Admin';
  if (!items.length) {
    el.innerHTML = emptyState('Nothing pending', 'New access requests will appear here once friends sign in.');
    return;
  }
  el.innerHTML = items
    .sort((a,b) => (a[1].requestedAt||0) - (b[1].requestedAt||0))
    .map(([ek, req]) => `
      <div class="card">
        <div class="wgr-question">${esc(req.name || req.email || '(no name)')}</div>
        <div class="wgr-meta">
          <span>${esc(req.email || '')}</span>
          ${req.requestedAt ? `<span>requested ${fmtDate(req.requestedAt)}</span>` : ''}
        </div>
        <div class="action-strip">
          <span class="action-label">Allow into the game?</span>
          <div class="action-buttons">
            <button class="btn-confirm" onclick="approvePending('${ek}')">Approve</button>
            <button class="btn-dispute" onclick="denyPending('${ek}')">Deny</button>
          </div>
        </div>
      </div>
    `).join('');
}

function approvePending(ek) {
  if (!isAdmin() || !_db) return;
  const req = S.pending[ek];
  const updates = {};
  updates[`${DB_PATH}/allowlist/${ek}`] = true;
  updates[`${DB_PATH}/pending/${ek}`]   = null;
  _db.ref().update(updates)
    .then(() => {
      toast('Approved');
      const name = req?.name || 'friend';
      const email = req?.email || '';
      if (navigator.share) {
        navigator.share({
          title: 'Kolache — You\'re in!',
          text: `Hey ${name}, you've been approved! Sign in with Google to start betting.`,
          url: 'https://kolache-e58fa.web.app'
        }).catch(() => {});
      } else if (email) {
        const subj = encodeURIComponent('Kolache — You\'re in!');
        const body = encodeURIComponent(`Hey ${name}, you've been approved! Sign in with Google to start betting:\nhttps://kolache-e58fa.web.app`);
        window.open(`mailto:${email}?subject=${subj}&body=${body}`);
      }
    })
    .catch(e => { console.error('approve:', e); toast('Approve failed'); });
}

function denyPending(ek) {
  if (!isAdmin() || !_db) return;
  _db.ref(`${DB_PATH}/pending/${ek}`).remove()
    .then(() => toast('Denied'))
    .catch(e => { console.error('deny:', e); toast('Deny failed'); });
}

// ── TABS ──────────────────────────────────────────────────────────────────
function switchTab(btn, view) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('v-' + view).classList.add('active');
  document.getElementById('fab').style.display = view === 'bets' ? 'flex' : 'none';
  try { localStorage.setItem('kolache_tab', view); } catch(e) {}
}

function restoreTab() {
  let tab;
  try { tab = localStorage.getItem('kolache_tab'); } catch(e) {}
  if (!tab) return;
  const btn = document.querySelector(`.tab[onclick*="'${tab}'"]`);
  if (btn) switchTab(btn, tab);
}

function openSheet(html) {
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('backdrop').classList.add('open');

function avatarColor(id) {
  // Stable hash-based color for any string id (push keys are not integers).
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return ['#292524','#3d5a80','#2d6a4f','#7b2d8b','#8b4513','#1d4e89'][Math.abs(h) % 6];
}

function openAccept(wagerId) {
